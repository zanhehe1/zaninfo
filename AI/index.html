<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@nqbinhan — zyo.lol</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --red: #ff003c;
            --red-glow: rgba(255, 0, 60, 0.6);
            --bg-glass: rgba(10, 10, 15, 0.55);
            --border-glass: rgba(255, 0, 60, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. CLICK TO ENTER OVERLAY */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .entry-text {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--red-glow);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* 2. BACKGROUND VIDEO / CANVAS */
        .bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(0.6) contrast(1.1);
            object-fit: cover;
        }

        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 3. MAIN BIO CARD (ZYO.LOL STYLE) */
        .profile-card {
            width: 420px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 35px rgba(255, 0, 60, 0.25), inset 0 0 15px rgba(255, 0, 60, 0.1);
            text-align: center;
            position: relative;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-card.active {
            transform: scale(1);
            opacity: 1;
        }

        /* Avatar Box */
        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--red);
            box-shadow: 0 0 20px var(--red-glow);
        }

        .badge-verified {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--red);
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: 0 0 10px var(--red-glow);
        }

        /* Username & Badge Row */
        .username {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 15px var(--red-glow);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .role-tag {
            font-size: 12px;
            color: #a0a0b0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .typewriter-text {
            font-size: 13px;
            color: #d1d1e0;
            min-height: 20px;
            margin-bottom: 20px;
        }

        /* Social Links Stack */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .link-item i {
            font-size: 18px;
            color: var(--red);
        }

        .link-item:hover {
            background: rgba(255, 0, 60, 0.15);
            border-color: var(--red);
            box-shadow: 0 0 15px var(--red-glow);
            transform: translateY(-2px);
        }

        /* Integrated Music Player */
        .music-player {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 60, 0.2);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .disc-icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 0, 60, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 14px;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-info {
            flex: 1;
            text-align: left;
            overflow: hidden;
        }

        .song-title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }

        .song-author {
            font-size: 10px;
            color: #8e8e9f;
        }

        .play-btn {
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-btn:hover { color: var(--red); }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="entry-text">[ Click anywhere to enter ]</div>
    </div>

    <video class="bg-video" autoplay loop muted playsinline id="bgVid">
        <source src="snaptik.vn_7658649579251977493.mov" type="video/mp4">
    </video>

    <canvas id="snow-canvas"></canvas>

    <div class="profile-card" id="card">
        <div class="avatar-box">
            <img src="snaptik.vn_7658649579251977493.mov" onerror="this.src='https://i.imgur.com/8Qp49X0.jpg'" class="avatar-img" alt="Avatar">
            <div class="badge-verified"><i class="fa-solid fa-check"></i></div>
        </div>

        <div class="username">nqbinhan</div>
        <div class="role-tag">Developer & Designer</div>

        <div class="typewriter-text"><span id="typewriter"></span></div>

        <div class="social-links">
            <a href="https://github.com" target="_blank" class="link-item">
                <span><i class="fa-brands fa-github" style="margin-right:10px;"></i> GitHub</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="https://facebook.com" target="_blank" class="link-item">
                <span><i class="fa-brands fa-facebook" style="margin-right:10px;"></i> Facebook</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="https://tiktok.com" target="_blank" class="link-item">
                <span><i class="fa-brands fa-tiktok" style="margin-right:10px;"></i> TikTok</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <div class="music-player">
            <div class="disc-icon" id="disc"><i class="fa-solid fa-compact-disc"></i></div>
            <div class="song-info">
                <div class="song-title">Background Audio</div>
                <div class="song-author">Playing now...</div>
            </div>
            <div class="play-btn" id="playBtn"><i class="fa-solid fa-pause"></i></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <script>
        // Entry Handler
        const entryScreen = document.getElementById('entry-screen');
        const card = document.getElementById('card');
        const bgMusic = document.getElementById('bgMusic');
        const disc = document.getElementById('disc');
        const playBtn = document.getElementById('playBtn');

        entryScreen.addEventListener('click', () => {
            entryScreen.style.opacity = '0';
            setTimeout(() => {
                entryScreen.style.visibility = 'hidden';
                card.classList.add('active');
            }, 500);

            // Play Music
            bgMusic.play().then(() => {
                disc.style.animationPlayState = 'running';
            }).catch(() => {});
        });

        // Toggle Music
        playBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                disc.style.animationPlayState = 'running';
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                bgMusic.pause();
                disc.style.animationPlayState = 'paused';
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        });

        // Typewriter Effect
        const words = ["Welcome to my bio profile.", "Building modern websites.", "HTML / CSS / JavaScript."];
        let i = 0, timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typewriter').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                timer = setTimeout(loopTyping, 80);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typewriter').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) { i++; } else { i = 0; }
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }

        typingEffect();

        // Snow Canvas Effect
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = Array.from({ length: 60 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 2 + 1,
            d: Math.random() * 1 + 0.5
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 0, 60, 0.6)';
            ctx.beginPath();
            particles.forEach(p => {
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            });
            ctx.fill();
            updateParticles();
        }

        function updateParticles() {
            particles.forEach(p => {
                p.y += p.d;
                if (p.y > height) {
                    p.y = 0;
                    p.x = Math.random() * width;
                }
            });
        }

        setInterval(drawParticles, 30);
    </script>
</body>
</html>

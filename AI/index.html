<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zan</title>

<link href="[https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap)" rel="stylesheet">
<style>
:root{
--ink: #0a0710;
--card-a: #1a0f22;
--card-b: #100816;
--line: rgba(255,255,255,0.09);
--crimson: #ff2b4a;
--gold: #ffb545;
--holo-a: #7cf5ff;
--holo-b: #ff8ce0;
--text: #f6eef9;
--muted: #a897b3;
font-family: 'Be Vietnam Pro', sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; min-height:100%; background: var(--ink); color: var(--text); overflow-x:hidden; }
.mono{ font-family:'Orbitron', sans-serif; }
a{ color:inherit; text-decoration:none; }
::selection{ background: var(--crimson); color:white; }
body{
background:
radial-gradient(900px 500px at 50% -10%, rgba(255,43,74,0.14), transparent 60%),
radial-gradient(700px 500px at 100% 100%, rgba(124,245,255,0.06), transparent 55%),
var(--ink);
}
body::before{
content:'';
position: fixed; inset:0;
background: repeating-linear-gradient(
0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px,
transparent 1px, transparent 3px
);
pointer-events:none;
z-index:1;
}
.page{
position:relative; z-index:2;
min-height:100vh;
display:flex; flex-direction:column; align-items:center; justify-content:center;
padding: 44px 18px 30px;
gap: 26px;
}
/* ===== RANK CARD ===== */
.stage{ perspective: 1100px; }
.card{
width: min(340px, 88vw);
aspect-ratio: 3/4.35;
position:relative;
border-radius: 22px;
background: linear-gradient(155deg, var(--card-a), var(--card-b));
border: 1px solid var(--line);
box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02);
transform-style: preserve-3d;
transform: perspective(1100px) rotateX(0deg) rotateY(0deg);
animation: idle-float 6s ease-in-out infinite;
padding: 20px 20px 22px;
display:flex; flex-direction:column;
opacity:0;
animation: idle-float 6s ease-in-out infinite, cardIn .7s ease forwards .1s;
}
@keyframes cardIn{ from{ opacity:0; transform: translateY(20px);} to{ opacity:1; transform: translateY(0);} }
@keyframes idle-float{ 0%,100%{ transform: rotateX(2deg) rotateY(-3deg); } 50%{ transform: rotateX(-2deg) rotateY(3deg); } }
.card .foil{
position:absolute; inset:0;
border-radius: 22px;
background: linear-gradient(115deg,
transparent 30%,
rgba(124,245,255,0.16) 42%,
rgba(255,255,255,0.30) 48%,
rgba(255,140,224,0.18) 54%,
transparent 66%);
background-size: 250% 250%;
background-position: var(--fx, 40%) var(--fy, 40%);
mix-blend-mode: color-dodge;
pointer-events:none;
opacity: 0.85;
}
.card .corner-cut{
position:absolute; top:0; right:0;
width: 70px; height:70px;
background: linear-gradient(135deg, transparent 50%, rgba(255,181,69,0.14) 50%);
border-radius: 0 22px 0 0;
pointer-events:none;
}
.card-top{
display:flex; align-items:center; justify-content:space-between;
margin-bottom: 14px;
position:relative; z-index:2;
}
.rank-chip{
font-family:'Orbitron', sans-serif;
font-size: 10px;
font-weight: 700;
letter-spacing: 1.5px;
color: var(--gold);
border: 1px solid rgba(255,181,69,0.4);
background: rgba(255,181,69,0.08);
padding: 5px 10px;
border-radius: 6px;
}
.online-tag{
display:flex; align-items:center; gap:6px;
font-size: 10px;
font-weight: 600;
color: var(--holo-a);
}
.online-tag .dot{
width:6px; height:6px; border-radius:50%;
background: var(--holo-a);
box-shadow: 0 0 8px var(--holo-a);
animation: blink 1.6s infinite;
}
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
.avatar-hex{
width: 108px; height: 118px;
margin: 4px auto 14px;
position:relative;
z-index:2;
}
.avatar-hex .glow{
position:absolute; inset:-14px;
background: conic-gradient(from 0deg, var(--crimson), var(--gold), var(--holo-a), var(--holo-b), var(--crimson));
clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0% 50%);
filter: blur(10px);
opacity: 0.7;
animation: spin 6s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }
.avatar-hex .frame{
position:absolute; inset:0;
clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);
background: var(--ink);
padding: 3px;
}
.avatar-hex img{
width:100%; height:100%;
object-fit:cover;
clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);
display:block;
}
#nameField{
font-family:'Orbitron', sans-serif;
font-weight: 800;
font-size: 22px;
text-align:center;
letter-spacing: 0.5px;
outline:none;
color: var(--text);
text-shadow: 0 0 18px rgba(255,43,74,0.5);
position:relative; z-index:2;
}
.tagline{
text-align:center;
font-size: 12.5px;
color: var(--muted);
margin: 8px 0 16px;
min-height: 18px;
position:relative; z-index:2;
font-weight: 500;
}
.tagline .cursor{ animation: blink 1s infinite; color: var(--crimson); }
.hud-stats{
display:flex; gap: 8px;
margin-bottom: 16px;
position:relative; z-index:2;
}
.hud-stat{
flex:1;
background: rgba(255,255,255,0.03);
border: 1px solid var(--line);
border-radius: 10px;
padding: 8px 6px;
text-align:center;
}
.hud-stat .v{
font-family:'Orbitron', sans-serif;
font-weight: 700;
font-size: 14px;
color: var(--gold);
}
.hud-stat .k{
font-size: 9px;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-top: 2px;
}
.visits{
text-align:center;
font-size: 10.5px;
color: var(--muted);
margin-top: auto;
position:relative; z-index:2;
}
.visits b{ color: var(--holo-a); font-family:'Orbitron', sans-serif; }
/* ===== HOTBAR SOCIAL SLOTS ===== */
.hotbar{
display:flex; gap: 10px;
background: rgba(255,255,255,0.03);
border: 1px solid var(--line);
padding: 10px;
border-radius: 18px;
backdrop-filter: blur(10px);
}
.slot{
position:relative;
width: 50px; height:50px;
border-radius: 12px;
background: rgba(255,255,255,0.04);
border: 1px solid var(--line);
display:flex; align-items:center; justify-content:center;
font-size: 19px;
cursor:pointer;
transition: transform .18s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
overflow:hidden;
}
.slot .key{
position:absolute; top:2px; left:4px;
font-family:'Orbitron', sans-serif;
font-size: 8px;
color: var(--muted);
}
.slot .tip{
position:absolute; bottom: 62px; left:50%;
transform: translateX(-50%) translateY(4px);
background: #17101d;
border: 1px solid var(--line);
color: var(--text);
font-size: 11px;
font-weight: 600;
padding: 5px 10px;
border-radius: 8px;
white-space:nowrap;
opacity:0;
pointer-events:none;
transition: opacity .15s ease, transform .15s ease;
}
.slot:hover{ transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }
.slot:hover .tip{ opacity:1; transform: translateX(-50%) translateY(0); }
.slot.tiktok:hover{ border-color:#fe2c55; background: rgba(254,44,85,0.12); }
.slot.telegram:hover{ border-color:#229ed9; background: rgba(34,158,217,0.12); }
.slot.discord:hover{ border-color:#5865f2; background: rgba(88,101,242,0.12); }
.audio-overlay{
position: fixed; inset:0; background: rgba(10,7,16,0.92);
display: flex; flex-direction: column; align-items: center; justify-content: center;
z-index: 999; transition: opacity .5s ease; cursor: pointer;
}
.audio-overlay h2{ font-family:'Orbitron',sans-serif; color: var(--holo-a); font-size: 18px; margin-bottom: 8px; }
.audio-overlay p{ color: var(--muted); font-size: 13px; }
footer{
position:relative; z-index:2;
text-align:center;
color: var(--muted);
font-size: 10.5px;
padding-bottom: 20px;
}
</style>
</head>

<script>
// Tự động phát nhạc khi người dùng tương tác lần đầu (click bất cứ đâu trên màn hình)
const bgMusic = document.getElementById('bgMusic');
const audioOverlay = document.getElementById('audioOverlay');
function unlockAudio() {
bgMusic.play().then(() => {
audioOverlay.style.opacity = '0';
setTimeout(() => audioOverlay.remove(), 500);
window.removeEventListener('click', unlockAudio);
window.removeEventListener('touchstart', unlockAudio);
}).catch(e => console.log(e));
}
window.addEventListener('click', unlockAudio);
window.addEventListener('touchstart', unlockAudio);
// Hiệu ứng gõ chữ
const words = ["Giao diện tối thượng", "Zan Profile", "Welcome to my world"];
let i = 0, j = 0, currentWord = "", isDeleting = false;
const typedSpan = document.getElementById('typedText');
function typeEffect() {
currentWord = words[i];
if (isDeleting) {
typedSpan.textContent = currentWord.substring(0, j - 1);
j--;
if (j === 0) { isDeleting = false; i = (i + 1) % words.length; }
} else {
typedSpan.textContent = currentWord.substring(0, j + 1);
j++;
if (j === currentWord.length) { isDeleting = true; setTimeout(typeEffect, 1500); return; }
}
setTimeout(typeEffect, isDeleting ? 50 : 100);
}
typeEffect();
// Hiệu ứng xoay 3D thẻ bài theo chuột
const card = document.getElementById('rankCard');
document.addEventListener('mousemove', (e) => {
const rect = card.getBoundingClientRect();
const x = e.clientX - rect.left;
const y = e.clientY - rect.top;
const xc = rect.width / 2;
const yc = rect.height / 2;
const dx = (x - xc) / xc;
const dy = (y - yc) / yc;
card.style.transform = perspective(1100px) rotateX(${ -dy * 10 }deg) rotateY(${ dx * 10 }deg);
card.style.setProperty('--fx', ${(x / rect.width) * 100}%);
card.style.setProperty('--fy', ${(y / rect.height) * 100}%);
});
document.addEventListener('mouseleave', () => {
card.style.transform = 'perspective(1100px) rotateX(0deg) rotateY(0deg)';
});
</script>

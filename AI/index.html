<style>
:root {
--bg: #030305;
--card-bg: rgba(12, 12, 18, 0.7);
--border: rgba(255, 255, 255, 0.08);
--border-glow: rgba(255, 45, 85, 0.4);
--accent: #ff2d55;
--accent-glow: rgba(255, 45, 85, 0.25);
--cyan: #00f0ff;
--text: #f4f4f6;
--muted: #8e8e93;
font-family: 'Plus Jakarta+Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
background-color: var(--bg);
color: var(--text);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow-x: hidden;
position: relative;
}
/* Đèn nền động */
.ambient-glow {
position: fixed;
width: 600px; height: 600px;
background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
top: 50%; left: 50%;
transform: translate(-50%, -50%);
z-index: 0;
pointer-events: none;
filter: blur(80px);
animation: pulseGlow 8s ease-in-out infinite alternate;
}
@keyframes pulseGlow {
0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
}
.grid-bg {
position: fixed; inset: 0;
background-image: linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
background-size: 40px 40px;
z-index: 0;
}
/* Khung chính */
.container {
position: relative;
z-index: 2;
width: 100%;
max-width: 440px;
padding: 24px;
display: flex;
flex-direction: column;
gap: 20px;
}
.glass-card {
background: var(--card-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border);
border-radius: 28px;
padding: 32px 24px;
text-align: center;
position: relative;
box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.glass-card:hover {
border-color: var(--border-glow);
box-shadow: 0 30px 70px rgba(0,0,0,0.7), 0 0 30px var(--accent-glow);
}
/* Badge trạng thái */
.status-badge {
display: inline-flex;
align-items: center;
gap: 8px;
background: rgba(255, 45, 85, 0.1);
border: 1px solid rgba(255, 45, 85, 0.3);
padding: 6px 14px;
border-radius: 50px;
font-size: 11px;
font-weight: 600;
letter-spacing: 0.5px;
color: var(--accent);
margin-bottom: 22px;
text-transform: uppercase;
}
.status-dot {
width: 6px; height: 6px;
background-color: var(--accent);
border-radius: 50%;
box-shadow: 0 0 10px var(--accent);
animation: blink 1.5s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
/* Avatar */
.avatar-container {
width: 110px; height: 110px;
margin: 0 auto 20px;
position: relative;
}
.avatar-ring {
position: absolute; inset: -4px;
border-radius: 50%;
background: conic-gradient(from 0deg, var(--accent), var(--cyan), transparent, var(--accent));
animation: rotateRing 6s linear infinite;
z-index: 1;
}
@keyframes rotateRing { to { transform: rotate(360deg); } }
.avatar-img {
position: relative; z-index: 2;
width: 100%; height: 100%;
border-radius: 50%;
object-fit: cover;
border: 3px solid var(--bg);
}
/* Tên & Mô tả */
.profile-name {
font-family: 'Space Grotesk', sans-serif;
font-size: 26px;
font-weight: 700;
letter-spacing: -0.5px;
color: var(--text);
margin-bottom: 6px;
}
.profile-bio {
font-size: 13.5px;
color: var(--muted);
line-height: 1.5;
margin-bottom: 24px;
min-height: 40px;
}
.profile-bio .cursor {
color: var(--accent);
animation: blink 0.8s infinite;
}
/* Thống kê nhanh */
.stats-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
margin-bottom: 26px;
}
.stat-box {
background: rgba(255, 255, 255, 0.02);
border: 1px solid var(--border);
border-radius: 16px;
padding: 12px 8px;
transition: background 0.2s ease;
}
.stat-box:hover {
background: rgba(255, 255, 255, 0.05);
}
.stat-value {
font-family: 'Space Grotesk', sans-serif;
font-size: 16px;
font-weight: 700;
color: var(--text);
margin-bottom: 2px;
}
.stat-label {
font-size: 10px;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 0.5px;
}
/* Danh sách liên kết (Social Links) */
.links-list {
display: flex;
flex-direction: column;
gap: 12px;
}
.social-link {
display: flex;
align-items: center;
justify-content: space-between;
background: rgba(255, 255, 255, 0.03);
border: 1px solid var(--border);
padding: 14px 18px;
border-radius: 16px;
color: var(--text);
text-decoration: none;
font-weight: 600;
font-size: 14px;
transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
position: relative;
overflow: hidden;
}
.social-link::before {
content: '';
position: absolute; inset: 0;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
transform: translateX(-100%);
transition: transform 0.5s ease;
}
.social-link:hover::before { transform: translateX(100%); }
.social-link:hover {
border-color: var(--accent);
background: rgba(255, 45, 85, 0.06);
transform: translateY(-2px);
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.link-left {
display: flex;
align-items: center;
gap: 12px;
}
.link-icon {
font-size: 18px;
}
.link-arrow {
color: var(--muted);
font-size: 14px;
transition: transform 0.2s ease, color 0.2s ease;
}
.social-link:hover .link-arrow {
transform: translateX(4px);
color: var(--accent);
}
/* Overlay âm thanh khởi động */
.audio-overlay {
position: fixed; inset: 0;
background: rgba(3, 3, 5, 0.95);
backdrop-filter: blur(10px);
z-index: 999;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
transition: opacity 0.5s ease;
}
.audio-overlay h2 {
font-family: 'Space Grotesk', sans-serif;
font-size: 20px;
color: var(--text);
margin-bottom: 8px;
letter-spacing: -0.5px;
}
.audio-overlay p {
font-size: 13px;
color: var(--muted);
}
footer {
text-align: center;
font-size: 11px;
color: var(--muted);
margin-top: 16px;
letter-spacing: 0.5px;
}
</style>

<script>
// Xử lý bật nhạc & ẩn overlay
const audioOverlay = document.getElementById('audioOverlay');
const bgMusic = document.getElementById('bgMusic');
function initAudio() {
bgMusic.play().catch(e => console.log(e));
audioOverlay.style.opacity = '0';
setTimeout(() => audioOverlay.remove(), 500);
window.removeEventListener('click', initAudio);
window.removeEventListener('touchstart', initAudio);
}
window.addEventListener('click', initAudio);
window.addEventListener('touchstart', initAudio);
// Hiệu ứng gõ chữ
const phrases = [
"Cyberpunk Nexus & Profile.",
"Khám phá thế giới của ZAN.",
"Tốc độ, Sáng tạo & Đam mê."
];
let pIdx = 0, charIdx = 0, isDeleting = false;
const typedSpan = document.getElementById('typedText');
function typeWriter() {
const current = phrases[pIdx];
if (isDeleting) {
typedSpan.textContent = current.substring(0, charIdx - 1);
charIdx--;
if (charIdx === 0) {
isDeleting = false;
pIdx = (pIdx + 1) % phrases.length;
}
} else {
typedSpan.textContent = current.substring(0, charIdx + 1);
charIdx++;
if (charIdx === current.length) {
isDeleting = true;
setTimeout(typeWriter, 1800);
return;
}
}
setTimeout(typeWriter, isDeleting ? 40 : 80);
}
typeWriter();
</script>

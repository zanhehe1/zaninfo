<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zan · zyo.lol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #0b0710;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* ---- Nền hạt ---- */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---- Container chính ---- */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            padding: 20px;
        }

        /* ---- Card chính ---- */
        .card {
            width: 320px;
            background: linear-gradient(145deg, #1a1122, #10081a);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 28px 22px 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            perspective: 800px;
            transition: transform 0.1s ease;
            cursor: pointer;
        }

        .card .glow-ring {
            position: absolute;
            inset: -2px;
            border-radius: 34px;
            padding: 2px;
            background: conic-gradient(from 0deg, #ff2b4a, #ffb545, #7cf5ff, #ff8ce0, #ff2b4a);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.6;
            animation: spin-ring 6s linear infinite;
            pointer-events: none;
        }
        @keyframes spin-ring {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- Avatar ---- */
        .avatar {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 43, 74, 0.3);
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ---- Tên & tagline ---- */
        .name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 30%, #b09bc0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 43, 74, 0.3);
        }

        .tagline {
            font-size: 13px;
            color: #a897b3;
            min-height: 24px;
            margin: 6px 0 16px;
            font-weight: 500;
            text-align: center;
        }
        .tagline .cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #ff2b4a;
            margin-left: 2px;
            animation: blink 0.9s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ---- HUD stats ---- */
        .stats {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 16px;
        }
        .stat-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
        }
        .stat-item .number {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 16px;
            color: #ffb545;
        }
        .stat-item .label {
            font-size: 9px;
            color: #7a6a85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ---- Player nhạc ---- */
        .music-player {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
        }

        .music-player .play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 43, 74, 0.2);
            border: 1px solid rgba(255, 43, 74, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            color: white;
        }
        .music-player .play-btn:hover {
            background: rgba(255, 43, 74, 0.35);
            transform: scale(1.05);
        }

        .music-player .info {
            flex: 1;
            min-width: 0;
        }
        .music-player .info .title {
            font-size: 12px;
            font-weight: 600;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-player .info .artist {
            font-size: 10px;
            color: #7a6a85;
        }

        .music-player .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 4px;
            cursor: pointer;
            position: relative;
        }
        .music-player .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff2b4a, #ffb545);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .music-player .time {
            font-size: 10px;
            color: #7a6a85;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* ---- Link bar ---- */
        .link-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }
        .link-item {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ccc;
            transition: 0.2s;
            text-decoration: none;
            position: relative;
        }
        .link-item:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .link-item .tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            background: #1a1122;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ddd;
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.15s;
        }
        .link-item:hover .tooltip {
            opacity: 1;
        }

        /* ---- Footer ---- */
        .footer {
            color: #4a3a55;
            font-size: 10px;
            margin-top: 10px;
        }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .card {
                width: 100%;
                max-width: 340px;
                padding: 20px 16px;
            }
            .name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas nền hạt -->
    <canvas id="particles-canvas"></canvas>

    <div class="container">

        <!-- Card chính -->
        <div class="card" id="card">
            <div class="glow-ring"></div>

            <div class="avatar">
                <img id="avatarImg" src="https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg" alt="avatar">
            </div>

            <div class="name">ZAN</div>
            <div class="tagline">
                <span id="typedText"></span><span class="cursor"></span>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="number">99</div>
                    <div class="label">Cấp độ</div>
                </div>
                <div class="stat-item">
                    <div class="number">1.2K</div>
                    <div class="label">Follow</div>
                </div>
                <div class="stat-item">
                    <div class="number">30</div>
                    <div class="label">Streak</div>
                </div>
            </div>

            <!-- Player nhạc -->
            <div class="music-player" id="musicPlayer">
                <button class="play-btn" id="playBtn">▶</button>
                <div class="info">
                    <div class="title" id="songTitle">Không yêu ai nữa</div>
                    <div class="artist" id="songArtist">nqbinhan</div>
                    <div class="progress-bar" id="progressBar">
                        <div class="fill" id="progressFill"></div>
                    </div>
                </div>
                <span class="time" id="timeDisplay">0:00 / 0:00</span>
            </div>

            <!-- Link bar -->
            <div class="link-bar">
                <a href="#" class="link-item" data-tooltip="TikTok">🎵<span class="tooltip">TikTok</span></a>
                <a href="#" class="link-item" data-tooltip="Instagram">📸<span class="tooltip">Instagram</span></a>
                <a href="#" class="link-item" data-tooltip="Facebook">📘<span class="tooltip">Facebook</span></a>
                <a href="#" class="link-item" data-tooltip="YouTube">▶️<span class="tooltip">YouTube</span></a>
                <a href="#" class="link-item" data-tooltip="Discord">🎮<span class="tooltip">Discord</span></a>
                <a href="#" class="link-item" data-tooltip="Zalo">💬<span class="tooltip">Zalo</span></a>
            </div>
        </div>

        <div class="footer">© 2026 — made with ❤️</div>
    </div>

    <script>
        // ============================================================
        // 1. HẠT NỀN (Particles)
        // ============================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let width, height, particles = [];
        const PARTICLE_COUNT = 70;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 1;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ============================================================
        // 2. CARD 3D TILT (nghiêng theo chuột)
        // ============================================================
        const card = document.getElementById('card');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            const rotateX = y * -12;
            const rotateY = x * 12;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        // ============================================================
        // 3. TYPING TAGLINE
        // ============================================================
        const phrases = [
            "» Đang tìm một bản tình ca...",
            "» Chạm vào card để nghe nhạc 🎵",
            "» Cảm ơn bạn đã ghé thăm ✨"
        ];
        let pIndex = 0,
            cIndex = 0,
            deleting = false;
        const typedEl = document.getElementById('typedText');

        function typeLoop() {
            const current = phrases[pIndex];
            if (!deleting) {
                cIndex++;
                typedEl.textContent = current.slice(0, cIndex);
                if (cIndex === current.length) {
                    deleting = true;
                    setTimeout(typeLoop, 2000);
                    return;
                }
            } else {
                cIndex--;
                typedEl.textContent = current.slice(0, cIndex);
                if (cIndex === 0) {
                    deleting = false;
                    pIndex = (pIndex + 1) % phrases.length;
                }
            }
            setTimeout(typeLoop, deleting ? 20 : 40);
        }
        typeLoop();

        // ============================================================
        // 4. MUSIC PLAYER (tự động phát khi click vào card)
        // ============================================================
        // Dùng bài hát "Không yêu ai nữa" - nqbinhan từ URL có sẵn
        const SONG_URL = 'https://files.catbox.moe/3bvhz6.mp3'; // thay bằng link nhạc bạn muốn

        const audio = new Audio(SONG_URL);
        audio.volume = 0.8;
        audio.loop = true;

        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');

        let isPlaying = false;

        // Cập nhật thanh tiến trình
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            const current = formatTime(audio.currentTime);
            const total = formatTime(audio.duration);
            timeDisplay.textContent = `${current} / ${total}`;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Play / Pause
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                // Nếu chưa có dữ liệu, load trước
                if (audio.readyState < 2) {
                    audio.load();
                }
                audio.play().catch(err => console.log('Tự động phát bị chặn, bấm vào card để phát'));
                playBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePlay();
        });

        // Click vào card để bật/tắt nhạc (giống zyo.lol)
        card.addEventListener('click', () => {
            if (!isPlaying) {
                // Nếu chưa phát, phát nhạc
                if (audio.readyState < 2) {
                    audio.load();
                }
                audio.play().catch(err => console.log('Tự động phát bị chặn'));
                playBtn.textContent = '⏸';
                isPlaying = true;
            } else {
                // Nếu đang phát, tạm dừng
                audio.pause();
                playBtn.textContent = '▶';
                isPlaying = false;
            }
        });

        // Click thanh tiến trình để tua
        progressBar.addEventListener('click', (e) => {
            if (audio.duration) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });

        // Khi nhạc kết thúc, reset nút
        audio.addEventListener('ended', () => {
            playBtn.textContent = '▶';
            isPlaying = false;
        });

        // ============================================================
        // 5. TOOLTIP CHO LINK (tự động từ data-tooltip)
        // ============================================================
        document.querySelectorAll('.link-item').forEach(el => {
            const tip = el.getAttribute('data-tooltip');
            if (tip) {
                const span = el.querySelector('.tooltip');
                if (span) span.textContent = tip;
            }
        });

        // ============================================================
        // 6. LƯU Ý: Nếu muốn đổi avatar, sửa src trong thẻ img
        // ============================================================
        console.log('🎵 Nhạc sẽ tự động phát khi click vào card!');
    </script>

</body>
</html>

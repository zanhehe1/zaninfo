<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zan Bot Manager</title>
<style>
:root{
  --bg:#07060d;--bg2:#0d0b18;--panel:#120f22;--panel2:#18142d;--line:#251f45;--line2:#322a5c;
  --tx:#ece9ff;--mut:#8f88b8;--pri:#8b5cf6;--neon:#b388ff;--pri2:#6d4aff;--cy:#5eead4;
  --ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--r:18px;--side:248px;
  --glow:0 0 0 1px rgba(139,92,246,.35),0 10px 40px -10px rgba(139,92,246,.45);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background-image:radial-gradient(700px 420px at 85% -5%,rgba(139,92,246,.16),transparent 60%),radial-gradient(600px 400px at 0 100%,rgba(79,70,229,.12),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--bg2),#090714);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),#4f46e5);display:grid;place-items:center;box-shadow:var(--glow)}
.brand b{font-size:16px;letter-spacing:-.2px}.brand small{display:block;color:var(--mut);font-size:11.5px;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);cursor:pointer;transition:.15s;margin-bottom:3px;font-weight:500}
.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:linear-gradient(90deg,rgba(139,92,246,.28),rgba(139,92,246,.06));color:#fff;box-shadow:inset 2px 0 0 var(--neon)}
.nav a .ct{margin-left:auto;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);padding:1px 8px;border-radius:99px;color:var(--mut)}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:12.5px;color:var(--mut)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 10px var(--ok)}
.side-foot.bad .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(7,6,13,.75);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.top h2{font-size:19px;letter-spacing:-.3px}
.ibtn.burger{display:none}
.sp{flex:1}
.sbox{position:relative;width:min(340px,38vw)}
.sbox input{width:100%;padding:9px 14px 9px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none}
.sbox input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(139,92,246,.22)}
.sbox .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative;transition:.15s}
.ibtn:hover{border-color:var(--pri)}
.ibtn .badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
.prof{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);background:var(--panel);border-radius:14px;cursor:pointer}
.prof .av{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#4f46e5);display:grid;place-items:center;font-weight:700}
.prof small{display:block;color:var(--mut);font-size:11.5px;line-height:1.1}
.page{padding:26px;max-width:1280px;margin:0 auto;animation:pg .28s both}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}

/* components */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:9px 15px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--pri);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px rgba(139,92,246,.8)}
.btn.dng{color:var(--bad)}.btn.dng:hover{border-color:var(--bad)}
.btn.dngf{background:var(--bad);color:#190509;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--mut);font-weight:400;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{display:flex;gap:14px;align-items:center;transition:.2s}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--glow)}
.kpi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(139,92,246,.16);color:var(--neon)}
.kpi.g .ic{background:rgba(52,211,153,.14);color:var(--ok)}.kpi.r .ic{background:rgba(251,113,133,.14);color:var(--bad)}.kpi.c .ic{background:rgba(94,234,212,.14);color:var(--cy)}
.kpi b{font-size:28px;letter-spacing:-.8px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{color:var(--ok);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25)}.pill.on::before{animation:pu 1.6s infinite}
.pill.off{color:var(--bad);background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.25)}
.pill.wn{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25)}
.pill.pp{color:var(--neon);background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.3)}
@keyframes pu{50%{opacity:.3}}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;background:rgba(139,92,246,.16);color:var(--neon)}
.tag.f{background:rgba(52,211,153,.14);color:var(--ok)}.tag.x{background:rgba(251,113,133,.14);color:var(--bad)}.tag.w{background:rgba(251,191,36,.14);color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:22px;letter-spacing:-.4px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:500}
.seg button.on{background:var(--panel2);color:#fff;box-shadow:0 0 0 1px var(--line2)}
.empty{color:var(--mut);text-align:center;padding:36px 12px}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}

/* bảng */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);background:var(--bg2);font-weight:600;position:sticky;top:0}
tbody tr{transition:.12s;cursor:pointer}tbody tr:hover{background:rgba(139,92,246,.07)}
tr:last-child td{border-bottom:0}
.cell{display:flex;align-items:center;gap:11px}
.av2{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.cell b{display:block;font-weight:600}.cell small{color:var(--mut);font-size:12px}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bc{cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:12px}
.bc:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--glow)}

/* log */
.lg-row{display:grid;grid-template-columns:148px 86px 1fr 70px;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.lg-row:last-child{border:0}
.ev{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev .d{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--neon);flex:none}
.ev.fail .d{background:var(--bad)}.ev.warn .d{background:var(--warn)}.ev.ok .d{background:var(--ok)}
.ev b{font-weight:600}.ev small{display:block;color:var(--mut);font-size:12px}

/* modal + drawer */
.ov{position:fixed;inset:0;background:rgba(3,2,8,.66);backdrop-filter:blur(6px);display:none;z-index:80;place-items:center;padding:16px}
.ov.show{display:grid}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:24px;width:100%;max-width:460px;box-shadow:0 40px 100px rgba(0,0,0,.6),var(--glow);animation:pg .2s both;max-height:92vh;overflow:auto}
.box h3{font-size:18px;margin-bottom:4px}.box>p{color:var(--mut);margin-bottom:16px;font-size:13.5px}
.fld{margin-bottom:13px}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);outline:none}
.fld .hint{font-size:12px;color:var(--mut);margin-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line2);background:var(--bg2);border-radius:99px;padding:3px 12px;font-size:12.5px;cursor:pointer;color:var(--mut)}
.chips button:hover,.chips button.on{border-color:var(--pri);color:#fff;background:rgba(139,92,246,.18)}
.mb{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.chk{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto}
.chk label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:5px 10px;cursor:pointer;margin:0;font-size:13px;color:var(--tx)}
.chk input{width:auto;accent-color:var(--pri)}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:70;transform:translateX(105%);transition:.28s cubic-bezier(.3,.8,.3,1);padding:22px;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.dw.show{transform:none}
.dwbg{position:fixed;inset:0;background:rgba(3,2,8,.5);z-index:65;display:none}.dwbg.show{display:block}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;font-size:13.5px;margin:14px 0}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-all}
.ulist{display:flex;flex-direction:column;gap:6px}
.u{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px}
.u .mono{flex:1}
.ib{border:0;background:none;cursor:pointer;color:var(--mut);padding:4px;border-radius:8px;display:grid;place-items:center}.ib:hover{background:var(--line);color:var(--bad)}

/* dropdown */
.dd{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:340px;max-width:92vw;padding:10px 14px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:none;z-index:60}
.dd.show{display:block}
.rel{position:relative}
.menu a{display:flex;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;align-items:center}.menu a:hover{background:var(--panel2)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--ok);padding:12px 16px;border-radius:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pg .2s both;max-width:360px;display:flex;gap:10px}
.toast.err{border-left-color:var(--bad)}
.skel{border-radius:var(--r);height:90px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}

/* login */
.lgn{min-height:100vh;display:grid;place-items:center;padding:16px}
.lgn .box{max-width:400px}
.lgn .brand{justify-content:center;padding-bottom:6px;flex-direction:column;text-align:center}
.lgn .brand .lg{width:56px;height:56px;border-radius:18px}
.err-t{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}

svg text{fill:var(--mut);font-size:11px}
.chart{width:100%;height:190px}

@media(max-width:1000px){.cols,.cols3{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:260px;transform:translateX(-105%);transition:.25s}
  aside.show{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.6)}
  .ibtn.burger{display:grid}
  .top{padding:12px 14px}.page{padding:16px 14px}
  .sbox{display:none}.sbox.open{display:block;position:absolute;left:14px;right:14px;top:62px;width:auto}
  .prof div{display:none}.prof{padding:4px}
  .lg-row{grid-template-columns:1fr auto;}.lg-row .c1,.lg-row .c2{grid-column:1/-1}
  .hide-m{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* console */
.term{background:#05040a;border:1px solid var(--line2);border-radius:16px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;height:calc(100vh - 270px);min-height:320px;overflow:auto;padding:12px 4px;box-shadow:inset 0 0 40px rgba(139,92,246,.07)}
.tl{display:flex;gap:10px;padding:1px 14px;white-space:pre-wrap;word-break:break-word}
.tl:hover{background:rgba(139,92,246,.08)}
.tl .tm{color:#5d5690;flex:none}.tl .tx{flex:1}
.tl.er .tx{color:#fb7185}.tl.wn .tx{color:#fbbf24}.tl.ok .tx{color:#6ee7b7}.tl.in .tx{color:#a5b4fc}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pu 1.6s infinite}
.live.off i{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:none}.live.pz i{background:var(--warn);box-shadow:none;animation:none}
@media(max-width:860px){.term{height:calc(100vh - 330px);font-size:11.5px}.tl{padding:1px 8px;gap:6px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script>
/* ============ tiện ích ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 13v1M15 13v1M2 14h2M20 14h2"/><circle cx="12" cy="3.5" r="1"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.3c2.2.7 3.5 2.7 3.5 5.7"/>',
 log:'<path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 bell:'<path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 refresh:'<path d="M21 12a9 9 0 11-3-6.7L21 8M21 3v5h-5"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3"/>',
 out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 power:'<path d="M12 2v10M18.4 6.6a9 9 0 11-12.8 0"/>',
 term:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13l3.5 7v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
const store={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};

let CSRF='',ROLE='',DATA={},ROUTE='dash',SEARCH='',FILTER='all',VIEW=store.get('bview','table'),REFRESH=+store.get('refresh','15')||15,TIMER=null,seenEv=+store.get('seenEv','0');

async function api(path,opt={}){
  const o={credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}};
  if(opt.method&&opt.method!=='GET')o.headers['X-CSRF-Token']=CSRF;
  let r;try{r=await fetch('/panel/api'+path,o)}catch{throw new Error('Không kết nối được backend (đã bật start.py chưa?)')}
  let j={};try{j=await r.json()}catch{}

function modal(html,onMount){

  $$('[data-x]',o).forEach(b=>b.onclick=close);
  document.body.append(o);onMount&&onMount(o,close);
  const f=$('input,select',o);f&&setTimeout(()=>f.focus(),40);return close;
}
function confirmBox(title,text,okLabel,fn,danger=true){

function drawer(html,onMount){

/* ============ biểu đồ SVG ============ */
function lineChart(points,w=560,h=190){
  if(points.length<2)return`<div class="empty" style="padding:50px 10px">Đang thu thập dữ liệu… (cứ 5 phút ghi 1 điểm, cần tối thiểu 2 điểm)</div>`;
  const mx=Math.max(1,...points.map(p=>Math.max(p.online,p.total))),pad=28;
  const X=i=>pad+i*(w-pad-8)/(points.length-1),Y=v=>h-24-(v/mx)*(h-44);
  const line=k=>points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');
  const area=`${line('online')} L${X(points.length-1)},${h-24} L${X(0)},${h-24}Z`;
  const t0=points[0].t.slice(11,16),t1=points.at(-1).t.slice(11,16);
  return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${w-8}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#251f45"/><text x="2" y="${Y(mx*f)+4}">${Math.round(mx*f)}</text>`).join('')}
  <path d="${area}" fill="url(#gA)"/><path d="${line('total')}" fill="none" stroke="#5b4f9a" stroke-dasharray="4 4"/>
  <path d="${line('online')}" fill="none" stroke="#b388ff" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="${pad}" y="${h-6}">${t0}</text><text x="${w-8}" y="${h-6}" text-anchor="end">${t1}</text></svg>`;
}
function barChart(map,w=560,h=170){
  const keys=[];const now=new Date();for(let i=23;i>=0;i--){const d=new Date(now-i*3600e3);const p=n=>String(n).padStart(2,'0');keys.push(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:00`)}
  const vals=keys.map(k=>map[k]||0),mx=Math.max(1,...vals),bw=(w-30)/24;
  if(!vals.some(v=>v))return`<div class="empty" style="padding:40px 10px">Chưa có thao tác quản trị nào trong 24 giờ qua</div>`;
  return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:150px">${vals.map((v,i)=>`<rect x="${26+i*bw}" y="${h-22-(v/mx)*(h-40)}" width="${bw-4}" height="${(v/mx)*(h-40)}" rx="3" fill="#8b5cf6" opacity="${.45+.55*v/mx}"><title>${keys[i].slice(11)} — ${v} thao tác</title></rect>`).join('')}
  <text x="2" y="${h-18-(h-40)}">${mx}</text><text x="26" y="${h-6}">-24h</text><text x="${w-4}" y="${h-6}" text-anchor="end">nay</text></svg>`;
}

/* ============ Trang: Log bot (console live) ============ */
let CON={since:0,lines:[],paused:false,auto:true,timer:null,lvl:'',ok:true,err:'',src:'local'};
const lvlOf=t=>/traceback|exception|error|❌|lỗi|failed|thất bại|fatal/i.test(t)?'er':/⚠|warn|timeout|disconnect|mất kết nối|reconnect/i.test(t)?'wn':/✅|success|thành công|online ok|started|đã (thêm|gửi|kết)/i.test(t)?'ok':/\[(bot|botmng|panel|admin|ping)\]/i.test(t)?'in':'';
function conLine(l){const c=lvlOf(l.s);return`<div class="tl ${c}"><span class="tm">${esc(l.t)}</span><span class="tx">${esc(l.s)}</span></div>`}
function conVisible(){const q=SEARCH.trim().toLowerCase();return CON.lines.filter(l=>(!CON.lvl||lvlOf(l.s)===CON.lvl)&&(!q||l.s.toLowerCase().includes(q)))}
function conPaint(){
  const t=$('#term');if(!t)return;const rows=conVisible();
  t.innerHTML=rows.length?rows.map(conLine).join(''):`<div class="empty">${CON.lines.length?'Không có dòng nào khớp bộ lọc':'Chưa có log. Khi bot in ra màn hình, log sẽ hiện ở đây.'}</div>`;
  if(CON.auto)t.scrollTop=t.scrollHeight;
  const c=$('#con-n');if(c)c.textContent=`${rows.length}/${CON.lines.length} dòng`;
}
function conStatus(){
  const e=$('#live');if(!e)return;
  e.className='live'+(CON.paused?' pz':!CON.ok?' off':'');
  e.innerHTML=`<i></i>${CON.paused?'Đã tạm dừng':!CON.ok?'Mất kết nối':'Trực tiếp • cập nhật mỗi 3 giây'}${CON.src==='remote'?' • từ máy bot':''}`;
  const er=$('#con-err');if(er){er.style.display=CON.err?'':'none';er.textContent=CON.err||''}
}
async function conTick(){
  if(ROUTE!=='console'||!$('#term')){clearInterval(CON.timer);CON.timer=null;return}
  if(CON.paused)return;
  try{
    const j=await api('/console?since='+CON.since);
    CON.ok=true;CON.err=j.error||'';CON.src=j.source||'local';
    if(j.reset){CON.lines=[]}
    if(j.lines.length){CON.lines.push(...j.lines);if(CON.lines.length>1500)CON.lines=CON.lines.slice(-1500);conPaint()}
    else if(j.reset)conPaint();
    CON.since=j.last;
  }catch(e){CON.ok=false;CON.err=e.message}
  conStatus();
}
function pConsole(v){
  if($('#chead')){conStatus();return}
  CON.since=0;CON.lines=[];
  v.innerHTML=`<div class="page"><div class="head" id="chead"><h1>Log bot trực tiếp</h1><span class="live" id="live"></span><span class="sp"></span>
    <div class="seg" id="c-l"><button data-l="" class="on">Tất cả</button><button data-l="er">Lỗi</button><button data-l="wn">Cảnh báo</button><button data-l="ok">OK</button></div>
    <button class="btn" id="c-p">Tạm dừng</button><button class="btn" id="c-a">Tự cuộn: bật</button><button class="btn" id="c-d">Tải .txt</button><button class="btn" id="c-c">Xoá màn hình</button></div>
    <div class="card" id="con-err" style="display:none;border-color:var(--bad);color:var(--bad);margin-bottom:12px"></div>
    <div class="term" id="term"></div><div class="mut" style="font-size:12px;margin-top:8px"><span id="con-n"></span> • Token đã được che tự động • Ô tìm kiếm ở trên cùng sẽ lọc log</div></div>`;
  $('#c-l').onclick=e=>{if(e.target.dataset.l===undefined)return;CON.lvl=e.target.dataset.l;$$('#c-l button').forEach(b=>b.classList.toggle('on',b===e.target));conPaint()};
  $('#c-p').onclick=()=>{CON.paused=!CON.paused;$('#c-p').textContent=CON.paused?'Tiếp tục':'Tạm dừng';conStatus();if(!CON.paused)conTick()};
  $('#c-a').onclick=()=>{CON.auto=!CON.auto;$('#c-a').textContent='Tự cuộn: '+(CON.auto?'bật':'tắt');if(CON.auto)conPaint()};
  $('#c-c').onclick=()=>{CON.lines=[];conPaint()};
  $('#c-d').onclick=()=>{const b=new Blob([conVisible().map(l=>l.t+' '+l.s).join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bot-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('#term').addEventListener('wheel',()=>{const t=$('#term');setTimeout(()=>{const atEnd=t.scrollHeight-t.scrollTop-t.clientHeight<30;if(!atEnd&&CON.auto){CON.auto=false;$('#c-a').textContent='Tự cuộn: tắt'}},50)},{passive:true});
  conStatus();conPaint();conTick();clearInterval(CON.timer);CON.timer=setInterval(conTick,3000);
}

    <div class="fld"><label>Mật khẩu admin mới (≥ 8 ký tự)</label><input id="p-n" type="password" ${s.admin_pw_env?'disabled':''}></div><button class="btn pri" id="p-s" ${s.admin_pw_env?'disabled':''}>Đổi mật khẩu admin</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="fld"><label>Tài khoản viewer (chỉ xem) — ${s.viewer_enabled?'đang bật':'đang tắt'}</label><input id="v-n" type="password" placeholder="Mật khẩu viewer mới (để trống = tắt)" ${s.viewer_pw_env?'disabled':''}></div><button class="btn" id="v-s" ${s.viewer_pw_env?'disabled':''}>Lưu viewer</button>`
    :'<div class="mut">Chỉ admin mới đổi được mật khẩu.</div>'}</div>
  <div class="card"><h3>${ic('shield')} Bảo mật & hệ thống</h3><dl class="kv" style="grid-template-columns:130px 1fr">
    <dt>Phiên đăng nhập</dt><dd>${s.session_hours||'–'} giờ</dd><dt>API key (script cũ)</dt><dd>${s.api_key_set?'<span class="tag f">Đã đặt</span>':'<span class="tag w">Chưa đặt • chỉ localhost</span>'}</dd><dt>Python</dt><dd>${esc(s.python||'–')}</dd><dt>Dữ liệu panel</dt><dd class="mono" style="font-size:12px">${esc(s.data_dir||'–')}</dd></dl>
    <button class="btn dng" id="s-lo">${ic('out')} Đăng xuất</button></div></div></div>`;
  $('#s-r').onchange=e=>{REFRESH=+e.target.value;store.set('refresh',REFRESH);startTimer();toast('Đã lưu')};
  $('#s-lo').onclick=()=>$('#lo').click();
  $('#p-s')&&($('#p-s').onclick=async()=>{try{const j=await api('/password',{method:'POST',body:JSON.stringify({account:'admin',current:$('#p-c').value,new:$('#p-n').value})});toast(j.msg);$('#p-c').value=$('#p-n').value=''}catch(e){toast(e.message,1)}});
  $('#v-s')&&($('#v-s').onclick=async()=>{try{const j=await api('/password',{method:'POST',body:JSON.stringify({account:'viewer',new:$('#v-n').value})});toast(j.msg);pSettings(v)}catch(e){toast(e.message,1)}});
}

/* ============ khởi động ============ */
function startTimer(){clearInterval(TIMER);if(REFRESH>0)TIMER=setInterval(()=>{if(!document.hidden&&!$('.ov.show'))loadAll(true)},REFRESH*1000)}
async function boot(){
  ROUTE=PAGES[location.hash.slice(1)]?location.hash.slice(1):'dash';
  shell();DATA={};renderPage();await loadAll();startTimer();
}
(async()=>{
  try{const j=await api('/me');CSRF=j.csrf;ROLE=j.role;boot()}catch{showLogin()}
})();
</script>
</body>
</html>

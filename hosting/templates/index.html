<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zan Hosting - Ping Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header .target {
            font-size: 13px;
            color: #94a3b8;
            font-family: monospace;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 16px;
        }
        .stat-card .label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        .stat-card .value { font-size: 20px; font-weight: bold; }
        .value.ok { color: #22c55e; }
        .value.err { color: #ef4444; }
        .value.wait { color: #eab308; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .log-box {
            background: #0a0f1c;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            padding: 16px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        .log-item {
            padding: 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .log-item:last-child { border-bottom: none; }
        .log-time { color: #64748b; }
        .log-status.ok { color: #22c55e; }
        .log-status.err { color: #ef4444; }
        .log-elapsed { color: #94a3b8; }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
            50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(34,197,94,0); }
        }
        .empty { color: #64748b; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Zan Hosting - Ping Monitor</h1>
            <div class="target">🎯 Target: https://zanhostingz.onrender.com</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="label">Trạng thái</div>
                <div class="value wait" id="status">Đang chờ...</div>
            </div>
            <div class="stat-card">
                <div class="label">Lần ping cuối</div>
                <div class="value" id="last-time" style="font-size: 14px;">-</div>
            </div>
            <div class="stat-card">
                <div class="label">HTTP Code</div>
                <div class="value" id="http-code">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Thời gian</div>
                <div class="value" id="elapsed">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Chu kỳ</div>
                <div class="value">10 phút</div>
            </div>
            <div class="stat-card">
                <div class="label">Tổng lần ping</div>
                <div class="value" id="total">0</div>
            </div>
        </div>

        <div class="controls">
            <button onclick="pingNow()">🔄 Ping ngay</button>
            <button onclick="loadLogs()">📋 Refresh Log</button>
        </div>

        <div class="log-box" id="logs">
            <div class="empty">Đang tải...</div>
        </div>
    </div>

    <script>
        async function loadStatus() {
            try {
                const r = await fetch("/api/status");
                const d = await r.json();
                const last = d.last_ping;

                document.getElementById("total").textContent = d.total_pings;

                if (last) {
                    document.getElementById("last-time").textContent = last.time;

                    const codeEl = document.getElementById("http-code");
                    codeEl.textContent = last.status;
                    codeEl.className = "value " + (last.ok ? "ok" : "err");

                    const statusEl = document.getElementById("status");
                    if (last.ok) {
                        statusEl.innerHTML = '<span class="pulse"></span>Hoạt động';
                        statusEl.className = "value ok";
                    } else {
                        statusEl.textContent = "Lỗi";
                        statusEl.className = "value err";
                    }

                    document.getElementById("elapsed").textContent = last.elapsed;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadLogs() {
            try {
                const r = await fetch("/api/logs");
                const d = await r.json();
                const box = document.getElementById("logs");

                if (!d.logs || d.logs.length === 0) {
                    box.innerHTML = '<div class="empty">Chưa có log</div>';
                    return;
                }

                box.innerHTML = d.logs.map(item => `
                    <div class="log-item">
                        <span class="log-time">${item.time}</span>
                        <span class="log-status ${item.ok ? 'ok' : 'err'}">
                            ${item.ok ? '✅' : '❌'} ${item.status}
                        </span>
                        <span class="log-elapsed">${item.elapsed}</span>
                    </div>
                `).join("");
            } catch (e) {
                console.error(e);
            }
        }

        async function pingNow() {
            const btn = event.target;
            btn.textContent = "⏳ Đang ping...";
            btn.disabled = true;
            try {
                await fetch("/api/ping-now");
                await loadStatus();
                await loadLogs();
            } catch (e) {
                alert("Lỗi: " + e);
            }
            btn.textContent = "🔄 Ping ngay";
            btn.disabled = false;
        }

        loadStatus();
        loadLogs();
        setInterval(loadStatus, 10000);
        setInterval(loadLogs, 30000);
    </script>
</body>
</html>

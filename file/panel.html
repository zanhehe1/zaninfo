<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Zan Bot Manager</title>
<style>
:root{
  --bg:#07060d;--bg2:#0d0b18;--panel:#120f22;--panel2:#18142d;--line:#251f45;--line2:#322a5c;
  --tx:#ece9ff;--mut:#8f88b8;--pri:#8b5cf6;--neon:#b388ff;--pri2:#6d4aff;--cy:#5eead4;
  --ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--r:18px;--side:248px;--pr:139,92,246;
  --glow:0 0 0 1px rgba(var(--pr),.35),0 10px 40px -10px rgba(var(--pr),.45);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background-image:radial-gradient(700px 420px at 85% -5%,rgba(var(--pr),.16),transparent 60%),radial-gradient(600px 400px at 0 100%,rgba(79,70,229,.12),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--bg2),#090714);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pri),#4f46e5);display:grid;place-items:center;box-shadow:var(--glow)}
.brand b{font-size:16px;letter-spacing:-.2px}.brand small{display:block;color:var(--mut);font-size:11.5px;margin-top:-2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);cursor:pointer;transition:.15s;margin-bottom:3px;font-weight:500}
.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:linear-gradient(90deg,rgba(var(--pr),.28),rgba(var(--pr),.06));color:#fff;box-shadow:inset 2px 0 0 var(--neon)}
.nav a .ct{margin-left:auto;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);padding:1px 8px;border-radius:99px;color:var(--mut)}
.side-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:12.5px;color:var(--mut)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 10px var(--ok)}
.side-foot.bad .dot{background:var(--bad);box-shadow:0 0 10px var(--bad)}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(7,6,13,.75);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.top h2{font-size:19px;letter-spacing:-.3px}
.ibtn.burger{display:none}
.sp{flex:1}
.sbox{position:relative;width:min(340px,38vw)}
.sbox input{width:100%;padding:9px 14px 9px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none}
.sbox input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(var(--pr),.22)}
.sbox .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;position:relative;transition:.15s}
.ibtn:hover{border-color:var(--pri)}
.ibtn .badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
.prof{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border:1px solid var(--line);background:var(--panel);border-radius:14px;cursor:pointer}
.prof .av{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#4f46e5);display:grid;place-items:center;font-weight:700}
.prof small{display:block;color:var(--mut);font-size:11.5px;line-height:1.1}
.page{padding:26px;max-width:1280px;margin:0 auto;animation:pg .28s both}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}

/* components */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:9px 15px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--pri);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px rgba(var(--pr),.8)}
.btn.dng{color:var(--bad)}.btn.dng:hover{border-color:var(--bad)}
.btn.dngf{background:var(--bad);color:#190509;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--mut);font-weight:400;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{display:flex;gap:14px;align-items:center;transition:.2s}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--glow)}
.kpi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--pr),.16);color:var(--neon)}
.kpi.g .ic{background:rgba(52,211,153,.14);color:var(--ok)}.kpi.r .ic{background:rgba(251,113,133,.14);color:var(--bad)}.kpi.c .ic{background:rgba(94,234,212,.14);color:var(--cy)}
.kpi b{font-size:28px;letter-spacing:-.8px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.on{color:var(--ok);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25)}.pill.on::before{animation:pu 1.6s infinite}
.pill.off{color:var(--bad);background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.25)}
.pill.wn{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25)}
.pill.pp{color:var(--neon);background:rgba(var(--pr),.14);border-color:rgba(var(--pr),.3)}
@keyframes pu{50%{opacity:.3}}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;background:rgba(var(--pr),.16);color:var(--neon)}
.tag.f{background:rgba(52,211,153,.14);color:var(--ok)}.tag.x{background:rgba(251,113,133,.14);color:var(--bad)}.tag.w{background:rgba(251,191,36,.14);color:var(--warn)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:22px;letter-spacing:-.4px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:500}
.seg button.on{background:var(--panel2);color:#fff;box-shadow:0 0 0 1px var(--line2)}
.empty{color:var(--mut);text-align:center;padding:36px 12px}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}

/* bảng */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);background:var(--bg2);font-weight:600;position:sticky;top:0}
tbody tr{transition:.12s;cursor:pointer}tbody tr:hover{background:rgba(var(--pr),.07)}
tr:last-child td{border-bottom:0}
.cell{display:flex;align-items:center;gap:11px}
.av2{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.cell b{display:block;font-weight:600}.cell small{color:var(--mut);font-size:12px}
.acts{display:flex;gap:6px;justify-content:flex-end}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.bc{cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:12px}
.bc:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--glow)}

/* log */
.lg-row{display:grid;grid-template-columns:148px 86px 1fr 70px;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.lg-row:last-child{border:0}
.ev{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.ev:last-child{border:0}
.ev .d{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--neon);flex:none}
.ev.fail .d{background:var(--bad)}.ev.warn .d{background:var(--warn)}.ev.ok .d{background:var(--ok)}
.ev b{font-weight:600}.ev small{display:block;color:var(--mut);font-size:12px}

/* modal + drawer */
.ov{position:fixed;inset:0;background:rgba(3,2,8,.66);backdrop-filter:blur(6px);display:none;z-index:80;place-items:center;padding:16px}
.ov.show{display:grid}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:24px;width:100%;max-width:460px;box-shadow:0 40px 100px rgba(0,0,0,.6),var(--glow);animation:pg .2s both;max-height:92vh;overflow:auto}
.box h3{font-size:18px;margin-bottom:4px}.box>p{color:var(--mut);margin-bottom:16px;font-size:13.5px}
.fld{margin-bottom:13px}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);outline:none}
.fld .hint{font-size:12px;color:var(--mut);margin-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line2);background:var(--bg2);border-radius:99px;padding:3px 12px;font-size:12.5px;cursor:pointer;color:var(--mut)}
.chips button:hover,.chips button.on{border-color:var(--pri);color:#fff;background:rgba(var(--pr),.18)}
.mb{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.chk{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto}
.chk label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:5px 10px;cursor:pointer;margin:0;font-size:13px;color:var(--tx)}
.chk input{width:auto;accent-color:var(--pri)}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:70;transform:translateX(105%);transition:.28s cubic-bezier(.3,.8,.3,1);padding:22px;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.dw.show{transform:none}
.dwbg{position:fixed;inset:0;background:rgba(3,2,8,.5);z-index:65;display:none}.dwbg.show{display:block}
.kv{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;font-size:13.5px;margin:14px 0}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-all}
.ulist{display:flex;flex-direction:column;gap:6px}
.u{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px}
.u .mono{flex:1}
.ib{border:0;background:none;cursor:pointer;color:var(--mut);padding:4px;border-radius:8px;display:grid;place-items:center}.ib:hover{background:var(--line);color:var(--bad)}

/* dropdown */
.dd{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:340px;max-width:92vw;padding:10px 14px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:none;z-index:60}
.dd.show{display:block}
.rel{position:relative}
.menu a{display:flex;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;align-items:center}.menu a:hover{background:var(--panel2)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--ok);padding:12px 16px;border-radius:13px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pg .2s both;max-width:360px;display:flex;gap:10px}
.toast.err{border-left-color:var(--bad)}
.skel{border-radius:var(--r);height:90px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}

/* login */
.lgn{min-height:100vh;display:grid;place-items:center;padding:16px}
.lgn .box{max-width:400px}
.lgn .brand{justify-content:center;padding-bottom:6px;flex-direction:column;text-align:center}
.lgn .brand .lg{width:56px;height:56px;border-radius:18px}
.err-t{color:var(--bad);font-size:13px;min-height:20px;margin-top:6px}

svg text{fill:var(--mut);font-size:11px}
.chart{width:100%;height:190px}

@media(max-width:1000px){.cols,.cols3{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:260px;transform:translateX(-105%);transition:.25s}
  aside.show{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.6)}
  .ibtn.burger{display:grid}
  .top{padding:12px 14px}.page{padding:16px 14px}
  .sbox{display:none}.sbox.open{display:block;position:absolute;left:14px;right:14px;top:62px;width:auto}
  .prof div{display:none}.prof{padding:4px}
  .lg-row{grid-template-columns:1fr auto;}.lg-row .c1,.lg-row .c2{grid-column:1/-1}
  .hide-m{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* console */
.term{background:#05040a;border:1px solid var(--line2);border-radius:16px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;height:calc(100vh - 270px);min-height:320px;overflow:auto;padding:12px 4px;box-shadow:inset 0 0 40px rgba(var(--pr),.07)}
.tl{display:flex;gap:10px;padding:1px 14px;white-space:pre-wrap;word-break:break-word}
.tl:hover{background:rgba(var(--pr),.08)}
.tl .tm{color:#5d5690;flex:none}.tl .tx{flex:1}
.tl.er .tx{color:#fb7185}.tl.wn .tx{color:#fbbf24}.tl.ok .tx{color:#6ee7b7}.tl.in .tx{color:#a5b4fc}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pu 1.6s infinite}
.live.off i{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:none}.live.pz i{background:var(--warn);box-shadow:none;animation:none}
@media(max-width:860px){.term{height:calc(100vh - 330px);font-size:11.5px}.tl{padding:1px 8px;gap:6px}}

/* ===== UPGRADE: aurora, avatar, hero, themes ===== */
html[data-ac=blue]{--pr:56,189,248;--pri:#38bdf8;--neon:#7dd3fc;--pri2:#0ea5e9}
html[data-ac=rose]{--pr:244,63,94;--pri:#f43f5e;--neon:#fb7185;--pri2:#e11d48}
html[data-ac=green]{--pr:16,185,129;--pri:#10b981;--neon:#6ee7b7;--pri2:#059669}
html[data-theme=light]{color-scheme:light;--bg:#f3f5ff;--bg2:#ffffff;--panel:#ffffff;--panel2:#eef1ff;--line:#e3e7f8;--line2:#cdd5f0;--tx:#1d2147;--mut:#6a7299;--ok:#059669;--bad:#e11d48;--warn:#d97706;--cy:#0d9488;--neon:var(--pri);--glow:0 0 0 1px rgba(var(--pr),.3),0 10px 30px -12px rgba(var(--pr),.35)}
html[data-theme=light] body{background-image:radial-gradient(700px 420px at 85% -5%,rgba(var(--pr),.12),transparent 60%),radial-gradient(600px 400px at 0 100%,rgba(56,189,248,.12),transparent 60%)}
html[data-theme=light] aside{background:linear-gradient(180deg,#fff,#f4f6ff)}
html[data-theme=light] .top{background:rgba(255,255,255,.82)}
html[data-theme=light] .nav a.on,html[data-theme=light] .seg button.on,html[data-theme=light] .chips button:hover,html[data-theme=light] .chips button.on{color:var(--tx)}
html[data-theme=light] .ov{background:rgba(30,35,80,.35)}
html[data-theme=light] .dwbg{background:rgba(30,35,80,.25)}
html[data-theme=light] .box,html[data-theme=light] .dw,html[data-theme=light] .dd,html[data-theme=light] .toast{box-shadow:0 30px 80px rgba(40,50,120,.22)}
html[data-theme=light] .btn.dngf{color:#fff}
html[data-theme=light] .tag,html[data-theme=light] .pill.pp{color:var(--pri2)}
html[data-theme=light] .aurora b{opacity:.2}
html[data-theme=light] .hero{background:linear-gradient(120deg,rgba(var(--pr),.16),rgba(var(--pr),.03) 55%),#fff}

#root{position:relative;z-index:1}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora b{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.34;animation:aur 22s ease-in-out infinite alternate}
.aurora b:nth-child(1){background:rgb(var(--pr));left:-12vmax;top:-14vmax}
.aurora b:nth-child(2){background:#22d3ee;right:-16vmax;top:18vh;animation-duration:28s;animation-delay:-8s;opacity:.18}
.aurora b:nth-child(3){background:#ec4899;left:30vw;bottom:-24vmax;animation-duration:32s;animation-delay:-14s;opacity:.16}
@keyframes aur{to{transform:translate(7vmax,5vmax) scale(1.18)}}

.avt{position:relative;isolation:isolate;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.avt::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--pri),var(--cy),var(--neon),var(--pri));animation:rot 4s linear infinite;z-index:-2}
.avt::after{content:attr(data-l);position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));z-index:-1}
.avt img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg2);display:block;background:var(--bg2)}
.avt.sm{width:32px;height:32px}.avt.sm img{border-width:2px}
.avt.md{width:68px;height:68px}
.avt.lg{width:112px;height:112px;font-size:36px;margin-bottom:6px}.avt.lg::before{inset:-5px;filter:blur(.3px)}.avt.lg img{border-width:5px}
.avt .st{position:absolute;right:1px;bottom:1px;width:26%;height:26%;border-radius:50%;background:var(--ok);border:2px solid var(--bg2);box-shadow:0 0 10px var(--ok);z-index:2}
.brand .avt{width:44px;height:44px}

.card{backdrop-filter:blur(6px)}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px;padding:20px 22px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,rgba(var(--pr),.24),rgba(var(--pr),.05) 55%),linear-gradient(180deg,var(--panel),var(--bg2));border-color:rgba(var(--pr),.38)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(var(--pr),.35),transparent 70%);pointer-events:none}
.hero h1{font-size:22px;letter-spacing:-.4px}
.hero p{color:var(--mut);margin-top:3px}
.hero .hb{flex:1;min-width:240px}
.hero .clk{margin-left:auto;text-align:right;position:relative;z-index:1}
.hero .clk b{display:block;font:700 30px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
.hero .clk small{color:var(--mut)}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;position:relative;z-index:1}
.kpi.w .ic{background:rgba(251,191,36,.14);color:var(--warn)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{padding:16px}
.card h3 .ct2{margin-left:auto;font-weight:500;color:var(--mut);font-size:12.5px}
.xrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 12px;margin-bottom:6px}
.xrow .mono{font-weight:600}
.xrow .gr{flex:1;min-width:0;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.sw:hover{transform:scale(1.1)}.sw.on{border-color:var(--tx);box-shadow:0 0 0 3px rgba(var(--pr),.35)}
.kbd{font:11px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line2);border-radius:6px;padding:1px 6px;color:var(--mut)}
.pi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--tx)}
.pi.on,.pi:hover{background:rgba(var(--pr),.18)}
.pi .i{color:var(--neon)}
.pin{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:15px}
.pin:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(var(--pr),.22)}
.hide-d{display:none}
@media(max-width:860px){.hero .clk{display:none}.hero h1{font-size:19px}.avt.md{width:56px;height:56px}}
</style>

const avt=(c='',st)=>`<span class="avt ${c}" data-l="Z"><img src="${AVATAR}" alt="">${st?'<i class="st"></i>':''}</span>`;
(()=>{const l=document.createElement('link');l.rel='icon';l.href=AVATAR;document.head.append(l)})();
const curTheme=()=>document.documentElement.dataset.theme==='light'?'light':'dark';
document.documentElement.dataset.theme=store.get('theme','dark');
document.documentElement.dataset.ac=store.get('ac','violet');
function setTheme(t){store.set('theme',t);document.documentElement.dataset.theme=t;const b=document.getElementById('thm');if(b)b.innerHTML=ic(t==='light'?'moon':'sun')}
const toggleTheme=()=>setTheme(curTheme()==='light'?'dark':'light');

let CSRF='',ROLE='',DATA={},ROUTE='dash',SEARCH='',FILTER='all',VIEW=store.get('bview','table'),REFRESH=+store.get('refresh','15')||15,TIMER=null,seenEv=+store.get('seenEv','0');

async function api(path,opt={}){
  const o={credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}};
  if(opt.method&&opt.method!=='GET')o.headers['X-CSRF-Token']=CSRF;
  let r;try{r=await fetch('/panel/api'+path,o)}catch{throw new Error('Không kết nối được backend (đã bật start.py chưa?)')}
  let j={};try{j=await r.json()}catch{}
  if(r.status===401&&path!=='/login'){showLogin();throw new Error('Phiên đăng nhập đã hết hạn')}
  if(!r.ok||j.ok===false)throw new Error(j.msg||('Lỗi '+r.status));
  return j;
}
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),250)},3800)}
const hue=id=>(Number(String(id).slice(-4))*47)%360;
const grad=id=>`linear-gradient(135deg,hsl(${hue(id)+240} 70% 58%),hsl(${(hue(id)+290)%360} 70% 46%))`;
const initial=n=>([...String(n||'').replace(/[^\p{L}\p{N}]/gu,'')][0]||'B').toUpperCase();
const bname=b=>b.label||b.nickname||'(chưa có tên)';
function leftTag(u){
  if(u.forever)return['Vĩnh viễn','f'];
  if(u.left_sec==null)return['Không rõ','w'];
  if(u.expired)return['Hết hạn','x'];
  const s=u.left_sec,d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return[d>0?`${d} ngày ${h}h`:h>0?`${h}h ${m}p`:`${m} phút`,d<3?'w':''];
}
const fmtUp=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}n ${h}h`:h?`${h}h ${m}p`:`${m} phút`};
const isAdmin=()=>ROLE==='admin';

/* ============ modal / drawer / confirm ============ */
function modal(html,onMount){
  const o=document.createElement('div');o.className='ov show';o.innerHTML=`<div class="box">${html}</div>`;
  const close=()=>o.remove();
  o.addEventListener('mousedown',e=>{if(e.target===o)close()});
  o.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  $$('[data-x]',o).forEach(b=>b.onclick=close);
  document.body.append(o);onMount&&onMount(o,close);
  const f=$('input,select',o);f&&setTimeout(()=>f.focus(),40);return close;
}
function confirmBox(title,text,okLabel,fn,danger=true){
  modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="mb"><button class="btn" data-x>Huỷ</button><button class="btn ${danger?'dngf':'pri'}" id="ok">${esc(okLabel)}</button></div>`,(o,close)=>{
    $('#ok',o).onclick=async()=>{const b=$('#ok',o);b.disabled=true;b.innerHTML='<span class="spin"></span>';try{await fn();close()}catch(e){toast(e.message,1);close()}};
  });
}
let drawerClose=null;
function drawer(html,onMount){
  closeDrawer();
  const bg=document.createElement('div');bg.className='dwbg';const d=document.createElement('div');d.className='dw';d.innerHTML=html;
  document.body.append(bg,d);requestAnimationFrame(()=>{bg.classList.add('show');d.classList.add('show')});
  drawerClose=()=>{bg.classList.remove('show');d.classList.remove('show');setTimeout(()=>{bg.remove();d.remove()},280);drawerClose=null};
  bg.onclick=drawerClose;$$('[data-dx]',d).forEach(b=>b.onclick=drawerClose);onMount&&onMount(d);
}
const closeDrawer=()=>drawerClose&&drawerClose();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* ============ đăng nhập ============ */
function showLogin(msg){
  clearInterval(TIMER);closeDrawer();
  $('#root').innerHTML=`<div class="lgn"><form class="box" id="lf" autocomplete="on">
   <div class="brand">${avt('lg',1)}<div><b style="font-size:22px">Zan Bot Manager</b><small>Đăng nhập để quản lý bot</small></div></div>
   <div class="fld"><label>Tài khoản</label><select id="lu" name="username"><option value="admin">admin — toàn quyền</option><option value="viewer">viewer — chỉ xem</option></select></div>
   <div class="fld"><label>Mật khẩu</label><input id="lp" name="password" type="password" autocomplete="current-password" required></div>
   <div class="err-t" id="le">${esc(msg||'')}</div>
   <div class="mb" style="margin-top:8px"><button class="btn pri" style="width:100%;justify-content:center" id="lb">Đăng nhập</button></div></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.innerHTML='<span class="spin"></span>';
    try{const j=await api('/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});CSRF=j.csrf;ROLE=j.role;boot()}
    catch(er){$('#le').textContent=er.message;b.disabled=false;b.textContent='Đăng nhập'}};
  $('#lp').focus();
}

/* ============ biểu đồ SVG ============ */
function lineChart(points,w=560,h=190){
  if(points.length<2)return`<div class="empty" style="padding:50px 10px">Đang thu thập dữ liệu… (cứ 5 phút ghi 1 điểm, cần tối thiểu 2 điểm)</div>`;
  const mx=Math.max(1,...points.map(p=>Math.max(p.online,p.total))),pad=28;
  const X=i=>pad+i*(w-pad-8)/(points.length-1),Y=v=>h-24-(v/mx)*(h-44);
  const line=k=>points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');
  const area=`${line('online')} L${X(points.length-1)},${h-24} L${X(0)},${h-24}Z`;
  const t0=points[0].t.slice(11,16),t1=points.at(-1).t.slice(11,16);
  return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pri)" stop-opacity=".5"/><stop offset="1" stop-color="var(--pri)" stop-opacity="0"/></linearGradient></defs>
  ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${w-8}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--line)"/><text x="2" y="${Y(mx*f)+4}">${Math.round(mx*f)}</text>`).join('')}
  <path d="${area}" fill="url(#gA)"/><path d="${line('total')}" fill="none" stroke="var(--mut)" stroke-opacity=".6" stroke-dasharray="4 4"/>
  <path d="${line('online')}" fill="none" stroke="var(--neon)" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="${pad}" y="${h-6}">${t0}</text><text x="${w-8}" y="${h-6}" text-anchor="end">${t1}</text></svg>`;
}
function barChart(map,w=560,h=170){
  const keys=[];const now=new Date();for(let i=23;i>=0;i--){const d=new Date(now-i*3600e3);const p=n=>String(n).padStart(2,'0');keys.push(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:00`)}
  const vals=keys.map(k=>map[k]||0),mx=Math.max(1,...vals),bw=(w-30)/24;
  if(!vals.some(v=>v))return`<div class="empty" style="padding:40px 10px">Chưa có thao tác quản trị nào trong 24 giờ qua</div>`;
  return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:150px">${vals.map((v,i)=>`<rect x="${26+i*bw}" y="${h-22-(v/mx)*(h-40)}" width="${bw-4}" height="${(v/mx)*(h-40)}" rx="3" fill="var(--pri)" opacity="${.45+.55*v/mx}"><title>${keys[i].slice(11)} — ${v} thao tác</title></rect>`).join('')}
  <text x="2" y="${h-18-(h-40)}">${mx}</text><text x="26" y="${h-6}">-24h</text><text x="${w-4}" y="${h-6}" text-anchor="end">nay</text></svg>`;
}

    return`<tr data-u="${u.uid}"><td><div class="cell"><div class="av2" style="background:${grad(u.uid)}">${esc(String(u.uid).slice(-2))}</div><b class="mono">${u.uid}</b></div></td>

 $('#price-save').onclick=()=>{const next=prices.map((p,i)=>({name:$(`[data-pname="${i}"]`,v).value.trim()||'Gói',time:$(`[data-ptime="${i}"]`,v).value.trim(),price:Math.max(0,+$(`[data-pprice="${i}"]`,v).value||0)}));if(next.some(p=>!/^\d{1,4}[hdwmy]$|^vv$/i.test(p.time)))return toast('Thời hạn phải dạng 1d, 7d, 30d, 3m hoặc vv',1);writeLocal(PRICE_KEY,next);toast('Đã lưu bảng giá');pSales(v)};
 $('#sales-csv').onclick=()=>downloadCSV('doanh-thu.csv',[['UID','Gói','Thời hạn','Giá','Thời gian','Ghi chú'],...sales.map(z=>[z.uid,z.package,z.time,z.price,z.at,z.desc||''])]);
}

/* ============ Trang: Log bot (console live) ============ */
let CON={since:0,lines:[],paused:false,auto:true,timer:null,lvl:'',ok:true,err:'',src:'local'};
const lvlOf=t=>/traceback|exception|error|❌|lỗi|failed|thất bại|fatal/i.test(t)?'er':/⚠|warn|timeout|disconnect|mất kết nối|reconnect/i.test(t)?'wn':/✅|success|thành công|online ok|started|đã (thêm|gửi|kết)/i.test(t)?'ok':/\[(bot|botmng|panel|admin|ping)\]/i.test(t)?'in':'';
function conLine(l){const c=lvlOf(l.s);return`<div class="tl ${c}"><span class="tm">${esc(l.t)}</span><span class="tx">${esc(l.s)}</span></div>`}
function conVisible(){const q=SEARCH.trim().toLowerCase();return CON.lines.filter(l=>(!CON.lvl||lvlOf(l.s)===CON.lvl)&&(!q||l.s.toLowerCase().includes(q)))}
function conPaint(){
  const t=$('#term');if(!t)return;const rows=conVisible();
  t.innerHTML=rows.length?rows.map(conLine).join(''):`<div class="empty">${CON.lines.length?'Không có dòng nào khớp bộ lọc':'Chưa có log. Khi bot in ra màn hình, log sẽ hiện ở đây.'}</div>`;
  if(CON.auto)t.scrollTop=t.scrollHeight;
  const c=$('#con-n');if(c)c.textContent=`${rows.length}/${CON.lines.length} dòng`;
}
function conStatus(){
  const e=$('#live');if(!e)return;
  e.className='live'+(CON.paused?' pz':!CON.ok?' off':'');
  e.innerHTML=`<i></i>${CON.paused?'Đã tạm dừng':!CON.ok?'Mất kết nối':'Trực tiếp • cập nhật mỗi 3 giây'}${CON.src==='remote'?' • từ máy bot':''}`;
  const er=$('#con-err');if(er){er.style.display=CON.err?'':'none';er.textContent=CON.err||''}
}
async function conTick(){
  if(ROUTE!=='console'||!$('#term')){clearInterval(CON.timer);CON.timer=null;return}
  if(CON.paused)return;
  try{
    const j=await api('/console?since='+CON.since);
    CON.ok=true;CON.err=j.error||'';CON.src=j.source||'local';
    if(j.reset){CON.lines=[]}
    if(j.lines.length){CON.lines.push(...j.lines);if(CON.lines.length>1500)CON.lines=CON.lines.slice(-1500);conPaint()}
    else if(j.reset)conPaint();
    CON.since=j.last;
  }catch(e){CON.ok=false;CON.err=e.message}
  conStatus();
}
function pConsole(v){
  if($('#chead')){conStatus();return}
  CON.since=0;CON.lines=[];
  v.innerHTML=`<div class="page"><div class="head" id="chead"><h1>Log bot trực tiếp</h1><span class="live" id="live"></span><span class="sp"></span>
    <div class="seg" id="c-l"><button data-l="" class="on">Tất cả</button><button data-l="er">Lỗi</button><button data-l="wn">Cảnh báo</button><button data-l="ok">OK</button></div>
    <button class="btn" id="c-p">Tạm dừng</button><button class="btn" id="c-a">Tự cuộn: bật</button><button class="btn" id="c-d">Tải .txt</button><button class="btn" id="c-c">Xoá màn hình</button></div>
    <div class="card" id="con-err" style="display:none;border-color:var(--bad);color:var(--bad);margin-bottom:12px"></div>
    <div class="term" id="term"></div><div class="mut" style="font-size:12px;margin-top:8px"><span id="con-n"></span> • Token đã được che tự động • Ô tìm kiếm ở trên cùng sẽ lọc log</div></div>`;
  $('#c-l').onclick=e=>{if(e.target.dataset.l===undefined)return;CON.lvl=e.target.dataset.l;$$('#c-l button').forEach(b=>b.classList.toggle('on',b===e.target));conPaint()};
  $('#c-p').onclick=()=>{CON.paused=!CON.paused;$('#c-p').textContent=CON.paused?'Tiếp tục':'Tạm dừng';conStatus();if(!CON.paused)conTick()};
  $('#c-a').onclick=()=>{CON.auto=!CON.auto;$('#c-a').textContent='Tự cuộn: '+(CON.auto?'bật':'tắt');if(CON.auto)conPaint()};
  $('#c-c').onclick=()=>{CON.lines=[];conPaint()};
  $('#c-d').onclick=()=>{const b=new Blob([conVisible().map(l=>l.t+' '+l.s).join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bot-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('#term').addEventListener('wheel',()=>{const t=$('#term');setTimeout(()=>{const atEnd=t.scrollHeight-t.scrollTop-t.clientHeight<30;if(!atEnd&&CON.auto){CON.auto=false;$('#c-a').textContent='Tự cuộn: tắt'}},50)},{passive:true});
  conStatus();conPaint();conTick();clearInterval(CON.timer);CON.timer=setInterval(conTick,3000);
}

/* ============ Trang: Nhật ký ============ */
let LOGF={type:'',status:'',hours:''};
async function pLogs(v){
  if(!$('#lhead')){
    v.innerHTML=`<div class="page"><div class="head" id="lhead"><h1>Nhật ký hoạt động</h1><span class="sp"></span>
     <select class="btn" id="l-t"><option value="">Mọi loại</option><option value="auth">Đăng nhập</option><option value="bot">Bot</option><option value="user">User</option><option value="settings">Cài đặt</option></select>
     <select class="btn" id="l-s"><option value="">Mọi trạng thái</option><option value="ok">Thành công</option><option value="fail">Thất bại</option><option value="warn">Cảnh báo</option></select>
     <select class="btn" id="l-h"><option value="">Mọi thời gian</option><option value="1">1 giờ qua</option><option value="24">24 giờ qua</option><option value="168">7 ngày qua</option></select>
     ${isAdmin()?`<button class="btn dng" id="l-c">${ic('trash')} Xoá log</button>`:''}</div><div class="card" style="padding:0" id="lbody"><div class="skel"></div></div></div>`;
    [['l-t','type'],['l-s','status'],['l-h','hours']].forEach(([i,k])=>$('#'+i).onchange=e=>{LOGF[k]=e.target.value;pLogs(v)});
    $('#l-c')&&($('#l-c').onclick=()=>confirmBox('Xoá toàn bộ nhật ký?','Hành động này không thể hoàn tác.','Xoá log',async()=>{await api('/logs',{method:'DELETE'});toast('Đã xoá nhật ký');pLogs(v)}));
  }
  const qs=new URLSearchParams({...LOGF,q:SEARCH});
  try{const j=await api('/logs?'+qs);
    $('#lbody').innerHTML=j.logs.length?`<div class="lg-row mut" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.6px"><span>Thời gian</span><span class="c2">Loại</span><span>Hành động</span><span>Kết quả</span></div>`+j.logs.map(r=>`<div class="lg-row"><span class="mono mut c1">${esc(r.t)}</span><span class="c2"><span class="pill pp">${esc(r.type)}</span></span><span><b>${esc(r.action)}</b> <span class="mut">• ${esc(r.actor)}</span><br><small class="mut">${esc(r.detail||'')}</small></span><span class="pill ${r.status==='ok'?'on':r.status==='fail'?'off':'wn'}">${r.status==='ok'?'OK':r.status==='fail'?'Lỗi':'Cảnh báo'}</span></div>`).join('')+`<div class="mut" style="padding:10px 16px;font-size:12px">Hiển thị ${j.logs.length}/${j.total} dòng • token đã bị che tự động</div>`:`<div class="empty">${ic('inbox')}<br>Không có dòng log nào khớp</div>`;
  }catch(e){$('#lbody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

/* ============ Trang: Cài đặt ============ */
async function pSettings(v){
  let s={};try{s=(await api('/settings')).info}catch(e){toast(e.message,1)}
  v.innerHTML=`<div class="page"><div class="head"><h1>Cài đặt</h1></div><div class="cols3">
  <div class="card"><h3>${ic('pulse')} Giao diện & làm mới</h3>
    <div class="fld"><label>Chế độ</label><div class="seg" id="s-th"><button data-th="dark" class="${curTheme()==='dark'?'on':''}">Tối</button><button data-th="light" class="${curTheme()==='light'?'on':''}">Sáng</button></div></div>
    <div class="fld"><label>Màu chủ đạo</label><div class="row" id="s-ac">${AC.map(a=>`<button class="sw ${document.documentElement.dataset.ac===a[0]?'on':''}" data-ac="${a[0]}" title="${a[1]}" style="background:${a[2]}"></button>`).join('')}</div></div>
    <div class="fld"><label>Tự cập nhật dữ liệu mỗi</label><select id="s-r">${[5,15,30,60,0].map(x=>`<option value="${x}" ${REFRESH===x?'selected':''}>${x?x+' giây':'Tắt tự cập nhật'}</option>`).join('')}</select><div class="hint">Lưu trên trình duyệt này.</div></div></div>
  <div class="card"><h3>${ic('key')} Tài khoản & mật khẩu</h3>
    ${isAdmin()?`<div class="fld"><label>Mật khẩu admin hiện tại</label><input id="p-c" type="password" ${s.admin_pw_env?'disabled placeholder="Đặt bằng biến môi trường"':''}></div>
    <div class="fld"><label>Mật khẩu admin mới (≥ 8 ký tự)</label><input id="p-n" type="password" ${s.admin_pw_env?'disabled':''}></div><button class="btn pri" id="p-s" ${s.admin_pw_env?'disabled':''}>Đổi mật khẩu admin</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="fld"><label>Tài khoản viewer (chỉ xem) — ${s.viewer_enabled?'đang bật':'đang tắt'}</label><input id="v-n" type="password" placeholder="Mật khẩu viewer mới (để trống = tắt)" ${s.viewer_pw_env?'disabled':''}></div><button class="btn" id="v-s" ${s.viewer_pw_env?'disabled':''}>Lưu viewer</button>`
    :'<div class="mut">Chỉ admin mới đổi được mật khẩu.</div>'}</div>
  <div class="card"><h3>${ic('shield')} Bảo mật & hệ thống</h3><dl class="kv" style="grid-template-columns:130px 1fr">
    <dt>Phiên đăng nhập</dt><dd>${s.session_hours||'–'} giờ</dd><dt>API key (script cũ)</dt><dd>${s.api_key_set?'<span class="tag f">Đã đặt</span>':'<span class="tag w">Chưa đặt • chỉ localhost</span>'}</dd><dt>Python</dt><dd>${esc(s.python||'–')}</dd><dt>Dữ liệu panel</dt><dd class="mono" style="font-size:12px">${esc(s.data_dir||'–')}</dd></dl>
    <button class="btn dng" id="s-lo">${ic('out')} Đăng xuất</button></div></div><div class="card"><h3>${ic('refresh')} Tự động & sao lưu</h3><div class="fld"><label><input type="checkbox" id="auto-revoke" checked> Tự thu hồi quyền đã hết hạn (mỗi phút)</label></div><div class="fld"><label><input type="checkbox" id="auto-restart"> Tự restart bot offline (tối đa 1 lần/10 phút mỗi bot)</label></div><button class="btn pri" id="auto-save">Lưu tự động hoá</button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><button class="btn" id="backup-down">Tải backup bot.json</button> <label class="btn" for="backup-file">Chọn file khôi phục</label><input id="backup-file" type="file" accept="application/json,.json" hidden><p class="hint">Khôi phục yêu cầu tất cả bot đã dừng; sau đó cần khởi động lại start.py.</p></div></div></div>`;
  let au={};try{au=(await api('/automation')).info}catch{};$('#auto-revoke').checked=au.auto_revoke!==false;$('#auto-restart').checked=!!au.auto_restart;$('#auto-save').onclick=async()=>{try{const j=await api('/automation',{method:'POST',body:JSON.stringify({auto_revoke:$('#auto-revoke').checked,auto_restart:$('#auto-restart').checked})});toast(j.msg)}catch(e){toast(e.message,1)}};$('#backup-down').onclick=()=>{const a=document.createElement('a');a.href='/panel/api/backup';a.download='bot-backup.json';a.click()};$('#backup-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const j=await api('/backup',{method:'POST',body:JSON.stringify({data})});toast(j.msg)}catch(err){toast(err.message,1)}e.target.value=''};
  $('#s-r').onchange=e=>{REFRESH=+e.target.value;store.set('refresh',REFRESH);startTimer();toast('Đã lưu')};
  $('#s-lo').onclick=()=>$('#lo').click();
  $('#s-th').onclick=e=>{const t=e.target.dataset.th;if(!t)return;setTheme(t);$$('#s-th button').forEach(b=>b.classList.toggle('on',b.dataset.th===t))};
  $('#s-ac').onclick=e=>{const a=e.target.dataset.ac;if(!a)return;document.documentElement.dataset.ac=a;store.set('ac',a);$$('#s-ac .sw').forEach(b=>b.classList.toggle('on',b.dataset.ac===a))};
  $('#p-s')&&($('#p-s').onclick=async()=>{try{const j=await api('/password',{method:'POST',body:JSON.stringify({account:'admin',current:$('#p-c').value,new:$('#p-n').value})});toast(j.msg);$('#p-c').value=$('#p-n').value=''}catch(e){toast(e.message,1)}});
  $('#v-s')&&($('#v-s').onclick=async()=>{try{const j=await api('/password',{method:'POST',body:JSON.stringify({account:'viewer',new:$('#v-n').value})});toast(j.msg);pSettings(v)}catch(e){toast(e.message,1)}});

/* ============ tiện ích mới ============ */
const AC=[['violet','Tím','linear-gradient(135deg,#8b5cf6,#6d4aff)'],['blue','Xanh dương','linear-gradient(135deg,#38bdf8,#0ea5e9)'],['rose','Hồng','linear-gradient(135deg,#fb7185,#e11d48)'],['green','Xanh lá','linear-gradient(135deg,#34d399,#059669)']];
let DASH_ANIM=false,BSORT=store.get('bsort','def'),USORT=store.get('usort','def');
function countUp(el){const t=+el.dataset.n||0;if(!t){el.textContent=0;return}const t0=performance.now(),d=700;(function f(n){const k=Math.min(1,(n-t0)/d);el.textContent=Math.round(t*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function tickClock(){const e=document.getElementById('clk');if(!e)return;const n=new Date();e.textContent=n.toLocaleTimeString('vi-VN',{hour12:false});const d=document.getElementById('clkd');if(d)d.textContent=n.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
setInterval(tickClock,1000);
function expiring(days=3){const r=[];for(const u of DATA.users||[])for(const g of u.grants||[]){if(g.forever||g.expired||g.left_sec==null)continue;if(g.left_sec<=days*86400)r.push({uid:u.uid,bot_id:g.bot_id,bot_name:g.bot_name,left:g.left_sec,g})}return r.sort((a,b)=>a.left-b.left)}
async function quickRenew(uid,bots,time,after){try{const j=await api('/users',{method:'POST',body:JSON.stringify({uid:String(uid),bots,time})});toast(j.msg||'Đã gia hạn');await loadAll(true);after&&after()}catch(e){toast(e.message,1)}}
function filterBots(){const r=filterBots0().slice();
  if(BSORT==='on')r.sort((a,b)=>(b.online-a.online)||(a.id-b.id));else if(BSORT==='users')r.sort((a,b)=>b.users.length-a.users.length);else if(BSORT==='name')r.sort((a,b)=>bname(a).localeCompare(bname(b),'vi'));return r}
const uMin=u=>{let m=Infinity;for(const g of u.grants){if(g.expired||g.forever||g.left_sec==null)continue;m=Math.min(m,g.left_sec)}return m};
function usersCmp(a,b){if(USORT==='exp'){const x=uMin(a),y=uMin(b);return x===y?0:x<y?-1:1}if(USORT==='bots')return b.grants.length-a.grants.length;if(USORT==='uid')return a.uid-b.uid;return 0}
function downloadCSV(name,rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const b=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã xuất '+name)}
function exportBots(){downloadCSV('bots.csv',[['ID','Bot UID','Nickname','Ghi chú','Trạng thái','Guild','Số user']].concat((DATA.bots||[]).map(b=>[b.id,b.botid,b.nickname,b.label,b.online?'Online':'Offline',b.guild?'Bật':'Tắt',b.users.length])))}
function exportUsers(){downloadCSV('users.csv',[['UID','Số bot','Còn hạn','Hạn gần nhất','Danh sách bot']].concat((DATA.users||[]).map(u=>{const[t]=uMin(u)===Infinity?['–']:leftTag({left_sec:uMin(u)});return[u.uid,u.grants.length,u.active,t,u.grants.map(g=>'#'+g.bot_id).join(' ')]})))}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const i=document.createElement('input');i.value=t;document.body.append(i);i.select();document.execCommand('copy');i.remove()}toast('Đã sao chép '+t)}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cp]');if(c){e.stopPropagation();copyText(c.dataset.cp)}},true);
function restartOffline(){const off=(DATA.bots||[]).filter(b=>!b.online);if(!off.length)return toast('Không có bot nào đang offline');
  confirmBox('Restart bot offline?',`${off.length} bot đang offline sẽ được khởi động lại lần lượt.`,'Restart',async()=>{let ok=0;for(const b of off){try{await api(`/bots/${b.id}/restart`,{method:'POST'});ok++}catch{}await new Promise(r=>setTimeout(r,600))}toast(`Đã gửi lệnh restart ${ok}/${off.length} bot`);setTimeout(()=>loadAll(true),4000)},false)}
function openPalette(){
  if(!ROLE||$('.ov.show'))return;
  const acts=[...Object.entries(PAGES).map(([k,[t,i]])=>({t:'Đi tới: '+t,i,f:()=>go(k)})),
    ...(isAdmin()?[{t:'Thêm bot mới',i:'plus',f:()=>botForm()},{t:'Cấp quyền cho user',i:'key',f:()=>grantForm()},{t:'Bán hàng & nhắc hạn',i:'bell',f:()=>go('sales')},{t:'Restart tất cả bot offline',i:'power',f:restartOffline}]:[]),
    {t:'Xuất danh sách bot (CSV)',i:'download',f:exportBots},{t:'Xuất danh sách user (CSV)',i:'download',f:exportUsers},
    {t:'Đổi giao diện sáng / tối',i:'sun',f:toggleTheme},{t:'Làm mới dữ liệu',i:'refresh',f:()=>loadAll()},{t:'Đăng xuất',i:'out',f:()=>$('#lo').click()}];
  modal(`<input class="pin" id="pq" placeholder="Gõ lệnh… vd: thêm bot, log, xuất, sáng" autocomplete="off"><div id="pl" style="margin-top:10px;max-height:340px;overflow:auto"></div><div class="mut" style="font-size:12px;margin-top:8px"><span class="kbd">↑</span> <span class="kbd">↓</span> chọn • <span class="kbd">Enter</span> chạy • <span class="kbd">Esc</span> đóng</div>`,(o,close)=>{
    let sel=0,list=acts;const draw=()=>{$('#pl',o).innerHTML=list.length?list.map((a,i)=>`<div class="pi ${i===sel?'on':''}" data-i="${i}">${ic(a.i)}<span>${esc(a.t)}</span></div>`).join(''):'<div class="empty" style="padding:18px">Không có lệnh nào khớp</div>';const e=$('.pi.on',o);e&&e.scrollIntoView({block:'nearest'})};
    const run=i=>{const a=list[i];if(a){close();setTimeout(a.f,30)}};
    $('#pq',o).oninput=e=>{const q=e.target.value.trim().toLowerCase();list=acts.filter(a=>a.t.toLowerCase().includes(q));sel=0;draw()};
    $('#pq',o).onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(list.length-1,sel+1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);draw()}else if(e.key==='Enter'){e.preventDefault();run(sel)}else if(e.key==='Escape')close()};
    $('#pl',o).onclick=e=>{const p=e.target.closest('.pi');p&&run(+p.dataset.i)};draw();
  });
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}
  else if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#gs')&&!$('.ov.show')){e.preventDefault();$('#gs').focus()}
});

/* ============ khởi động ============ */
function startTimer(){clearInterval(TIMER);if(REFRESH>0)TIMER=setInterval(()=>{if(!document.hidden&&!$('.ov.show'))loadAll(true)},REFRESH*1000)}
async function boot(){
  ROUTE=PAGES[location.hash.slice(1)]?location.hash.slice(1):'dash';
  shell();DATA={};renderPage();await loadAll();startTimer();
}
(async()=>{
  try{const j=await api('/me');CSRF=j.csrf;ROLE=j.role;boot()}catch{showLogin()}
})();
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Hex Decoder</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            text-align: center;
            font-weight: 700;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #334155;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .result-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .result-title {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .result-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .result-item {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-wrap: break-word;
            word-break: break-all;
        }

        .result-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .result-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: var(--text);
        }

        .result-value.highlight {
            color: var(--success);
            font-weight: bold;
        }

        .result-value.error {
            color: var(--error);
        }

        .pre-block {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-ok {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-fail {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .status-warn {
            background-color: rgba(234, 179, 8, 0.2);
            color: #eab308;
            border: 1px solid #eab308;
        }

        .error-msg {
            color: var(--error);
            font-weight: 600;
            margin-top: 1rem;
        }

        /* Loading animation */
        .loader {
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader.active {
            display: block;
        }
    </style>
</head>
<body>

    <h1>🔥 Free Fire Hex Decoder</h1>
    <p class="subtitle">Dán mã Hex vào bên dưới để giải mã thông tin đăng nhập</p>

    <div class="container">
        <div class="input-group">
            <label for="hexInput">Mã Hex (MajorLogin / GetLoginData / Auth Packet)</label>
            <textarea id="hexInput" placeholder="Dán mã hex vào đây... (Ví dụ: 0a0b... )"></textarea>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="decodeHex()">🔍 Giải Mã</button>
            <button class="btn-secondary" onclick="clearAll()">🗑️ Xóa</button>
            <button class="btn-secondary" onclick="pasteFromClipboard()">📋 Dán</button>
        </div>

        <div class="loader" id="loader"></div>
        <div class="error-msg" id="errorMsg" style="display: none;"></div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-title">📊 Kết Quả Giải Mã</div>
            
            <div class="result-grid" id="resultGrid">
                <!-- Kết quả sẽ được đổ vào đây -->
            </div>

            <div class="result-title" style="margin-top: 1.5rem;">📄 Chi Tiết (Dữ Liệu Thô)</div>
            <div class="pre-block" id="rawDetails"></div>
        </div>
    </div>

    <script>
        // Hàm chuyển đổi Hex string thành mảng byte
        function hexToBytes(hex) {
            hex = hex.replace(/\s/g, '');
            if (hex.length % 2 !== 0) {
                throw new Error("Mã Hex có độ dài không hợp lệ (phải là số chẵn)");
            }
            const bytes = [];
            for (let i = 0; i < hex.length; i += 2) {
                bytes.push(parseInt(hex.substr(i, 2), 16));
            }
            return bytes;
        }

        // Hàm đọc Varint từ mảng byte
        function readVarint(bytes, pos) {
            let result = 0;
            let shift = 0;
            while (pos < bytes.length) {
                const b = bytes[pos++];
                result |= (b & 0x7F) << shift;
                if ((b & 0x80) === 0) {
                    break;
                }
                shift += 7;
            }
            return { value: result, pos: pos };
        }

        // Hàm parse Protobuf thủ công
        function parseProtobuf(bytes, startOffset = 0) {
            const fields = {};
            let pos = startOffset;

            while (pos < bytes.length) {
                try {
                    const keyRes = readVarint(bytes, pos);
                    const key = keyRes.value;
                    pos = keyRes.pos;
                    
                    const fieldNum = key >> 3;
                    const wireType = key & 0x07;

                    if (wireType === 0) {
                        const valRes = readVarint(bytes, pos);
                        pos = valRes.pos;
                        fields[fieldNum] = valRes.value;
                    } else if (wireType === 2) {
                        const lenRes = readVarint(bytes, pos);
                        const len = lenRes.value;
                        pos = lenRes.pos;
                        
                        if (pos + len > bytes.length) break;
                        const val = bytes.slice(pos, pos + len);
                        pos += len;
                        
                        // Thử decode UTF-8 xem có phải string không
                        const str = new TextDecoder('utf-8').decode(new Uint8Array(val));
                        fields[fieldNum] = str;
                    } else if (wireType === 5) {
                        if (pos + 4 > bytes.length) break;
                        const val = bytes.slice(pos, pos + 4);
                        pos += 4;
                        fields[fieldNum] = Array.from(val);
                    } else if (wireType === 1) {
                        if (pos + 8 > bytes.length) break;
                        const val = bytes.slice(pos, pos + 8);
                        pos += 8;
                        fields[fieldNum] = Array.from(val);
                    } else {
                        break;
                    }
                } catch (e) {
                    break;
                }
            }
            return fields;
        }

        // Hàm giải mã JWT
        function decodeJWT(token) {
            try {
                const parts = token.split('.');
                if (parts.length !== 3) return null;
                const payload = parts[1];
                const decoded = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
                return JSON.parse(decoded);
            } catch (e) {
                return null;
            }
        }

        // Hàm trích xuất JWT từ chuỗi
        function findJWT(str) {
            const regex = /eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g;
            const matches = str.match(regex);
            return matches ? matches[0] : null;
        }

        // Hàm chính giải mã
        function decodeHex() {
            const hexInput = document.getElementById('hexInput').value;
            const resultSection = document.getElementById('resultSection');
            const errorMsg = document.getElementById('errorMsg');
            const resultGrid = document.getElementById('resultGrid');
            const rawDetails = document.getElementById('rawDetails');
            const loader = document.getElementById('loader');

            // Reset
            errorMsg.style.display = 'none';
            resultSection.style.display = 'none';
            resultGrid.innerHTML = '';
            rawDetails.textContent = '';

            if (!hexInput.trim()) {
                showError("Vui lòng nhập mã Hex cần giải mã.");
                return;
            }

            loader.classList.add('active');

            setTimeout(() => {
                try {
                    const bytes = hexToBytes(hexInput);
                    
                    let parsedData = {};
                    let parsedSuccess = false;
                    let startOffset = 0;

                    // Thử parse với offset 0
                    let tempParsed = parseProtobuf(bytes, 0);
                    
                    // Nếu không có field 1, 8 hoặc 21, thử parse với offset 64 (gói MajorLogin)
                    if (!tempParsed[1] && !tempParsed[21] && bytes.length > 64) {
                        const tempParsed64 = parseProtobuf(bytes, 64);
                        if (tempParsed64[1] || tempParsed64[21] || tempParsed64[22]) {
                            parsedData = tempParsed64;
                            startOffset = 64;
                            parsedSuccess = true;
                        } else {
                            parsedData = tempParsed;
                        }
                    } else {
                        parsedData = tempParsed;
                        parsedSuccess = true;
                    }

                    // Nếu vẫn không có, thử toàn bộ
                    if (!parsedSuccess) {
                        parsedData = parseProtobuf(bytes, 0);
                    }

                    // Trích xuất thông tin
                    let accountId = null;
                    let nickname = null;
                    let lockRegion = null;
                    let onlineIp = null;
                    let onlinePort = null;
                    let chatIp = null;
                    let chatPort = null;
                    let key = null;
                    let iv = null;
                    let timestamp = null;
                    let clientVersion = null;
                    let releaseVersion = null;
                    let isEmulator = null;
                    let jwtToken = null;
                    let regionName = null;

                    // Tìm JWT trong toàn bộ dữ liệu
                    const rawString = bytes.map(b => String.fromCharCode(b)).join('');
                    const foundJwt = findJWT(rawString);
                    
                    if (foundJwt) {
                        jwtToken = foundJwt;
                        const jwtData = decodeJWT(foundJwt);
                        if (jwtData) {
                            accountId = jwtData.account_id || null;
                            nickname = jwtData.nickname || null;
                            lockRegion = jwtData.lock_region || null;
                            clientVersion = jwtData.client_version || null;
                            releaseVersion = jwtData.release_version || null;
                            isEmulator = jwtData.is_emulator !== undefined ? jwtData.is_emulator : null;
                        }
                    }

                    // Lấy Key/IV/Timestamp từ field 21, 22, 23
                    if (parsedData[21]) timestamp = parsedData[21];
                    
                    if (parsedData[22]) {
                        try {
                            key = bytesToHex(parsedData[22]);
                        } catch (e) {}
                    }
                    if (parsedData[23]) {
                        try {
                            iv = bytesToHex(parsedData[23]);
                        } catch (e) {}
                    }

                    // Lấy Account ID từ field 1
                    if (parsedData[1] && !accountId) {
                        accountId = parsedData[1];
                    }

                    // Lấy Nickname từ field 4 (nếu có)
                    if (parsedData[4] && typeof parsedData[4] === 'string') {
                        nickname = parsedData[4];
                    }

                    // Lấy Online IP/Port từ field 14 (Online Server)
                    if (parsedData[14] && typeof parsedData[14] === 'string') {
                        const str = parsedData[14];
                        if (str.length > 6) {
                            onlineIp = str.substring(0, str.length - 6);
                            onlinePort = str.substring(str.length - 6);
                        }
                    }

                    // Lấy Chat IP/Port từ field 32 (Chat Server)
                    if (parsedData[32] && typeof parsedData[32] === 'string') {
                        const str = parsedData[32];
                        if (str.length > 6) {
                            chatIp = str.substring(0, str.length - 6);
                            chatPort = str.substring(str.length - 6);
                        }
                    }

                    // Tìm Region Name từ toàn bộ dữ liệu (Cao Bằng, Hà Nội...)
                    const regionRegex = /(Cao Bằng|Hà Nội|Hồ Chí Minh|Đà Nẵng|Hải Phòng|Cần Thơ|Singapore|Thailand|Indonesia)/i;
                    const regionMatch = rawString.match(regionRegex);
                    if (regionMatch) {
                        regionName = regionMatch[0];
                    }

                    // Hiển thị kết quả
                    resultSection.style.display = 'block';
                    
                    const addResultItem = (label, value, isHighlight = false) => {
                        if (value === null || value === undefined || value === '') return;
                        
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        
                        const labelDiv = document.createElement('div');
                        labelDiv.className = 'result-label';
                        labelDiv.textContent = label;
                        
                        const valueDiv = document.createElement('div');
                        valueDiv.className = 'result-value' + (isHighlight ? ' highlight' : '');
                        valueDiv.textContent = value;
                        
                        div.appendChild(labelDiv);
                        div.appendChild(valueDiv);
                        resultGrid.appendChild(div);
                    };

                    // Hiển thị thông tin chính
                    if (accountId) addResultItem("🆔 Account ID", accountId, true);
                    if (nickname) addResultItem("👤 Nickname", nickname, true);
                    if (lockRegion) addResultItem("🌍 Lock Region", lockRegion);
                    if (regionName) addResultItem("📍 Vị trí", regionName);
                    if (clientVersion) addResultItem("📱 Client Version", clientVersion);
                    if (releaseVersion) addResultItem("🔖 Release Version", releaseVersion);
                    if (isEmulator !== null) addResultItem("💻 Is Emulator", isEmulator ? "Có (Emulator)" : "Không (Real Device)");
                    
                    if (onlineIp) addResultItem("🌐 Online IP", onlineIp, true);
                    if (onlinePort) addResultItem("🔌 Online Port", onlinePort, true);
                    if (chatIp) addResultItem("💬 Chat IP", chatIp);
                    if (chatPort) addResultItem("💬 Chat Port", chatPort);
                    
                    if (timestamp) addResultItem("⏰ Timestamp", timestamp);
                    if (key) addResultItem("🔑 Key (Hex)", key);
                    if (iv) addResultItem("🔒 IV (Hex)", iv);
                    if (jwtToken) addResultItem("🎫 JWT Token", jwtToken.substring(0, 80) + "...");

                    // Hiển thị chi tiết thô (tất cả các field)
                    let rawOutput = `=== CHI TIẾT PROTOBUF (Offset: ${startOffset}) ===\n\n`;
                    for (const [fieldNum, value] of Object.entries(parsedData)) {
                        rawOutput += `Field ${fieldNum}: `;
                        if (typeof value === 'string') {
                            // Nếu là chuỗi in được, hiển thị dạng text, nếu không hiển thị hex
                            const isPrintable = /^[\x20-\x7E\s]+$/.test(value);
                            if (isPrintable && value.length > 0) {
                                rawOutput += `"${value}"\n`;
                            } else {
                                rawOutput += `[Bytes] ${value}\n`;
                            }
                        } else {
                            rawOutput += `${value}\n`;
                        }
                    }
                    
                    rawOutput += `\n=== JWT DECODED ===\n\n`;
                    if (jwtToken) {
                        const jwtData = decodeJWT(jwtToken);
                        if (jwtData) {
                            rawOutput += JSON.stringify(jwtData, null, 2) + '\n';
                        } else {
                            rawOutput += `Không thể giải mã JWT\n`;
                        }
                    } else {
                        rawOutput += `Không tìm thấy JWT trong gói tin\n`;
                    }

                    rawDetails.textContent = rawOutput;

                } catch (err) {
                    showError("Lỗi khi giải mã: " + err.message);
                } finally {
                    loader.classList.remove('active');
                }
            }, 100);
        }

        // Hàm chuyển mảng byte sang Hex string
        function bytesToHex(bytes) {
            if (Array.isArray(bytes)) {
                return bytes.map(b => b.toString(16).padStart(2, '0')).join('');
            }
            if (typeof bytes === 'string') {
                // Nếu là string, chuyển sang hex
                const arr = [];
                for (let i = 0; i < bytes.length; i++) {
                    arr.push(bytes.charCodeAt(i).toString(16).padStart(2, '0'));
                }
                return arr.join('');
            }
            return '';
        }

        // Hiển thị lỗi
        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = "❌ " + msg;
            errorMsg.style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
        }

        // Xóa tất cả
        function clearAll() {
            document.getElementById('hexInput').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }

        // Dán từ clipboard
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('hexInput').value = text;
            } catch (err) {
                alert("Không thể truy cập clipboard. Vui lòng dán thủ công (Ctrl+V).");
            }
        }
    </script>
</body>
</html>

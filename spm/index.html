
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAN SPM Dashboard</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:20px;
    background:#080b16;
    color:#e8edff;
    font-family:Arial,sans-serif;
}
.container{max-width:1100px;margin:auto}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}
h1{color:#00eaff;margin:0}
.status{color:#00ff9d;font-size:13px}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
}
.card{
    background:#11182a;
    border:1px solid #243451;
    border-radius:14px;
    padding:18px;
}
.card small{color:#8293b5}
.value{
    font-size:27px;
    font-weight:bold;
    margin-top:10px;
    color:#00eaff;
}
.section{
    margin-top:20px;
    background:#11182a;
    border:1px solid #243451;
    border-radius:14px;
    padding:16px;
}
.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
}
button{
    border:1px solid #00cce8;
    background:#10283b;
    color:#00eaff;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
    font-weight:bold;
}
button:hover{background:#16445d}
button.danger{
    border-color:#ff4568;
    color:#ff6680;
    background:#351525;
}
.logs{
    height:360px;
    overflow-y:auto;
    background:#070b14;
    border:1px solid #26334b;
    border-radius:10px;
    padding:12px;
    font-family:monospace;
    font-size:13px;
}
.log{
    padding:8px;
    border-bottom:1px solid #182238;
    overflow-wrap:anywhere;
    line-height:1.5;
}
.log-time{color:#7185a9}
.log-info{color:#c8d5ee}
.log-warn{color:#ffbd4a}
.log-error{color:#ff5577}
.log-success{color:#00efa5}
.empty{color:#7185a9;text-align:center;padding:30px}
.footer{
    color:#637493;
    font-size:12px;
    text-align:center;
    margin-top:18px;
}
</style>
</head>
<body>
<div class="container">

    <div class="header">
        <div>
            <h1>ZAN SPM</h1>
            <div class="status" id="connection">● Đang kết nối...</div>
        </div>
        <button onclick="refreshStats()">REFRESH</button>
    </div>

    <div class="grid">
        <div class="card">
            <small>UPTIME</small>
            <div class="value" id="uptime">00:00:00</div>
        </div>
        <div class="card">
            <small>ACCOUNTS</small>
            <div class="value" id="accounts">0</div>
        </div>
        <div class="card">
            <small>SUCCESS</small>
            <div class="value" id="success">0</div>
        </div>
        <div class="card">
            <small>FAILED</small>
            <div class="value" id="failed">0</div>
        </div>
        <div class="card">
            <small>STATUS</small>
            <div class="value" id="status">--</div>
        </div>
    </div>

    <div class="section">
        <div class="section-head">
            <h3>LIVE LOGS</h3>
            <div>
                <button onclick="copyLogs()">COPY LOG</button>
                <button class="danger" onclick="clearLogs()">CLEAR</button>
            </div>
        </div>
        <div class="logs" id="logs">
            <div class="empty">Đang chờ logs...</div>
        </div>
    </div>

    <div class="footer">
        ZAN SPM DASHBOARD
    </div>
</div>

<script>
const API_URL = "/stats";

let serverUptime = 0;
let uptimeReceivedAt = Date.now();
let lastLogs = [];
let renderedLogs = [];
let uptimeTimer = null;

function formatUptime(seconds){
    seconds = Math.max(0, Math.floor(seconds));
    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    const time =
        String(hours).padStart(2,"0") + ":" +
        String(minutes).padStart(2,"0") + ":" +
        String(secs).padStart(2,"0");

    return days > 0 ? days + "d " + time : time;
}

// Uptime tự tăng mỗi giây, độc lập với API polling.
function startUptime(){
    if(uptimeTimer) clearInterval(uptimeTimer);

    uptimeTimer = setInterval(()=>{
        const elapsed = Math.floor((Date.now() - uptimeReceivedAt) / 1000);
        document.getElementById("uptime").textContent =
            formatUptime(serverUptime + elapsed);
    },1000);
}

function getLogMessage(item){
    if(typeof item === "string") return item;

    return item.message ||
           item.msg ||
           item.text ||
           JSON.stringify(item);
}

function getLogTime(item){
    if(typeof item === "object" && item.time){
        return item.time;
    }
    return new Date().toLocaleTimeString("vi-VN");
}

function getLogClass(message){
    const msg = String(message).toLowerCase();

    if(
        msg.includes("failed") ||
        msg.includes("fail") ||
        msg.includes("error") ||
        msg.includes("✗")
    ){
        return "log-error";
    }

    if(
        msg.includes("success") ||
        msg.includes("connected") ||
        msg.includes("thành công") ||
        msg.includes("✓")
    ){
        return "log-success";
    }

    if(
        msg.includes("warn") ||
        msg.includes("warning")
    ){
        return "log-warn";
    }

    return "log-info";
}

function renderLogs(logs){
    const box = document.getElementById("logs");
    const wasAtBottom =
        box.scrollHeight - box.scrollTop - box.clientHeight < 50;

    if(!Array.isArray(logs)) logs = [];

    lastLogs = logs;
    renderedLogs = logs.map(item => ({
        time:getLogTime(item),
        message:getLogMessage(item)
    }));

    if(renderedLogs.length === 0){
        box.innerHTML = '<div class="empty">Chưa có logs</div>';
        return;
    }

    box.innerHTML = renderedLogs.map(item=>{
        const safeMessage = escapeHtml(item.message);
        const safeTime = escapeHtml(item.time);
        const cls = getLogClass(item.message);

        return `
            <div class="log ${cls}">
                <span class="log-time">[${safeTime}]</span>
                <span>${safeMessage}</span>
            </div>
        `;
    }).join("");

    if(wasAtBottom) box.scrollTop = box.scrollHeight;
}

function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    })[char]);
}

async function refreshStats(){
    const connection = document.getElementById("connection");

    try{
        const response = await fetch(API_URL,{
            cache:"no-store"
        });

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        connection.textContent = "● ONLINE";
        connection.style.color = "#00ff9d";

        // Đồng bộ uptime từ server, sau đó tiếp tục tăng từng giây.
        const receivedUptime = Number(
            data.uptime_sec ??
            data.uptime ??
            0
        );

        if(Number.isFinite(receivedUptime) && receivedUptime >= 0){
            serverUptime = receivedUptime;
            uptimeReceivedAt = Date.now();

            document.getElementById("uptime").textContent =
                formatUptime(serverUptime);
        }

        document.getElementById("accounts").textContent =
            data.accounts ?? data.total_accounts ?? 0;

        document.getElementById("success").textContent =
            data.success ?? data.success_count ?? 0;

        document.getElementById("failed").textContent =
            data.failed ?? data.failed_count ?? 0;

        document.getElementById("status").textContent =
            data.status ?? "ONLINE";

        renderLogs(data.logs ?? []);

    }catch(error){
        connection.textContent = "● OFFLINE";
        connection.style.color = "#ff5577";
        console.error("Dashboard API error:",error);
    }
}

async function copyLogs(){
    const text = renderedLogs.map(item =>
        `[${item.time}] ${item.message}`
    ).join("\n");

    if(!text){
        alert("Không có log để copy!");
        return;
    }

    try{
        await navigator.clipboard.writeText(text);
        alert("Đã copy toàn bộ log!");
    }catch(error){
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();

        try{
            document.execCommand("copy");
            alert("Đã copy toàn bộ log!");
        }catch(e){
            alert("Không thể copy log trên trình duyệt này.");
        }

        textarea.remove();
    }
}

function clearLogs(){
    renderedLogs = [];
    lastLogs = [];
    document.getElementById("logs").innerHTML =
        '<div class="empty">Logs đã được xóa trên dashboard</div>';
}

startUptime();
refreshStats();

// API cập nhật 3 giây/lần; uptime vẫn chạy độc lập mỗi giây.
setInterval(refreshStats,3000);
</script>
</body>
</html>

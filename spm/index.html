<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOT Control Panel</title>
  <style>
    :root {
      --bg: #090d1a; --surface: #11182c; --border: #243256;
      --text: #eef2ff; --muted: #8b9dc3;
      --green: #22c55e; --red: #ef4444; --cyan: #38bdf8; --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 15px; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    
    .topbar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; }
    .brand h1 { font-size: 20px; }
    .brand p { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .status-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 20px; background: rgba(34, 197, 94, 0.15); color: var(--green); font-size: 13px; font-weight: bold; border: 1px solid rgba(34, 197, 94, 0.3); }
    .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 15px; }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
    .card-label { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: bold; }
    .card-value { font-size: 26px; font-weight: bold; margin-top: 8px; }
    .c-cyan { color: var(--cyan); } .c-green { color: var(--green); } .c-red { color: var(--red); } .c-amber { color: var(--amber); }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 5px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; height: 500px; margin-bottom: 15px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 14px; }
    .toolbar { display: flex; gap: 8px; }
    .btn { background: #1a2540; border: 1px solid var(--border); color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn:hover { background: #243256; }
    .btn.active { background: rgba(56, 189, 248, 0.2); border-color: var(--cyan); color: var(--cyan); }

    .terminal { flex: 1; overflow-y: auto; padding: 12px; background: #05070f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6; }
    
    .log-line { display: flex; gap: 8px; margin-bottom: 4px; word-break: break-all; }
    .log-time { color: #64748b; flex: 0 0 auto; }
    .log-tag { font-weight: bold; flex: 0 0 auto; }
    .log-msg { color: #cbd5e1; flex: 1 1 auto; }
    
    .lvl-ok .log-tag, .lvl-ok .log-msg { color: var(--green); }
    .lvl-err .log-tag, .lvl-err .log-msg { color: var(--red); }
    .lvl-info .log-tag { color: var(--cyan); }
    .lvl-warn .log-tag, .lvl-warn .log-msg { color: var(--amber); }
    .lvl-rotator .log-tag { color: #c084fc; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>BOT Control Panel</h1>
        <p>Tự động cập nhật mỗi 3 giây</p>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="dot"></span>
        <span id="status-text">Đang kết nối...</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="card">
        <div class="card-label">Bot Đang Chạy</div>
        <div class="card-value c-cyan" id="bot-online">0</div>
        <div class="card-sub">Leaders: <span id="leaders">0</span></div>
      </div>
      <div class="card">
        <div class="card-label">Đã Join Code</div>
        <div class="card-value c-green" id="join-success">0</div>
        <div class="card-sub">Tỉ lệ: <span id="join-rate">0.0%</span></div>
      </div>
      <div class="card">
        <div class="card-label">Code Failed</div>
        <div class="card-value c-red" id="join-fail">0</div>
        <div class="card-sub">Tổng thử: <span id="join-attempts">0</span></div>
      </div>
      <div class="card">
        <div class="card-label">Thời Gian Chạy</div>
        <div class="card-value c-amber" id="uptime">00:00:00</div>
        <div class="card-sub">Gen: <span id="gen">0</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>LIVE TERMINAL</span>
        <div class="toolbar">
          <button class="btn active" id="btn-autoscroll">Auto-scroll: ON</button>
          <button class="btn" id="btn-clear-log">Xóa màn hình</button>
        </div>
      </div>
      <div class="terminal" id="term-body">
        <div class="log-line"><span class="log-time">[--:--:--]</span><span class="log-tag">[SYS]</span><span class="log-msg">Đang chờ log từ máy chủ...</span></div>
      </div>
    </div>
  </div>

  <script>
    let allLogs = [];
    let autoScroll = true;
    let clearedBeforeId = 0;
    const termBody = document.getElementById("term-body");
    const btnAutoScroll = document.getElementById("btn-autoscroll");
    const btnClearLog = document.getElementById("btn-clear-log");

    function esc(str) {
      return String(str).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c];
      });
    }

    function renderLogs() {
      const filtered = allLogs.filter(item => item.id > clearedBeforeId);
      
      if (filtered.length === 0) {
        termBody.innerHTML = '<div class="log-line"><span class="log-time">[--:--:--]</span><span class="log-tag">[SYS]</span><span class="log-msg">Chưa có log mới...</span></div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      filtered.forEach(item => {
        const lvlClass = `lvl-${item.level || "info"}`;
        const div = document.createElement("div");
        div.className = `log-line ${lvlClass}`;
        div.innerHTML = `
          <span class="log-time">[${esc(item.time)}]</span>
          <span class="log-tag">[${esc(item.tag)}]</span>
          <span class="log-msg">${esc(item.message)}</span>
        `;
        fragment.appendChild(div);
      });

      termBody.replaceChildren(fragment);

      if (autoScroll) {
        termBody.scrollTop = termBody.scrollHeight;
      }
    }

    btnAutoScroll.addEventListener("click", () => {
      autoScroll = !autoScroll;
      btnAutoScroll.textContent = `Auto-scroll: ${autoScroll ? "ON" : "OFF"}`;
      btnAutoScroll.classList.toggle("active", autoScroll);
      if (autoScroll) termBody.scrollTop = termBody.scrollHeight;
    });

    btnClearLog.addEventListener("click", () => {
      if (allLogs.length > 0) {
        clearedBeforeId = allLogs[allLogs.length - 1].id;
      }
      renderLogs();
    });

    async function fetchData() {
      try {
        const res = await fetch("/stats", { cache: "no-store" });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        document.getElementById("status-pill").style.borderColor = "rgba(34, 197, 94, 0.3)";
        document.getElementById("status-text").textContent = "Online";
        document.getElementById("status-text").style.color = "var(--green)";

        document.getElementById("bot-online").textContent = data.bot_online || 0;
        document.getElementById("leaders").textContent = data.leaders || 0;
        document.getElementById("join-success").textContent = data.join_success || 0;
        document.getElementById("join-fail").textContent = data.join_fail || 0;
        document.getElementById("join-attempts").textContent = data.join_attempts || 0;
        document.getElementById("uptime").textContent = data.uptime || "00:00:00";
        document.getElementById("gen").textContent = data.gen || 0;

        const rate = data.join_attempts > 0 ? ((data.join_success / data.join_attempts) * 100).toFixed(1) + "%" : "0.0%";
        document.getElementById("join-rate").textContent = rate;

        if (Array.isArray(data.logs)) {
          allLogs = data.logs;
          renderLogs();
        }
      } catch (err) {
        document.getElementById("status-pill").style.borderColor = "rgba(239, 68, 68, 0.4)";
        document.getElementById("status-text").textContent = "Mất kết nối";
        document.getElementById("status-text").style.color = "var(--red)";
      }
    }

    fetchData();
    setInterval(fetchData, 3000);
  </script>
</body>
</html>

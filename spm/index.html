<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZansPM Dashboard</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #121a2f;
    --border: rgba(125,155,255,.15);
    --text: #e6edf3;
    --muted: #8fa3c0;
    --green: #20e3a2;
    --red: #ff5478;
    --blue: #4f8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  
  /* LOGIN */
  .login-wrap {
    display: flex; align-items: center; justify-content: center; height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1b2a4a, #0b1020 80%);
  }
  .login-card {
    width: 100%; max-width: 380px; padding: 40px 30px;
    background: rgba(18,26,47,.9); border: 1px solid var(--border);
    border-radius: 16px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .login-card h1 { font-size: 24px; margin-bottom: 8px; }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 14px; margin-bottom: 16px;
    background: #0d1527; border: 1px solid var(--border); border-radius: 10px;
    color: white; font-size: 15px; outline: none;
  }
  .login-card input:focus { border-color: var(--blue); }
  .login-card button {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--blue); color: white; font-size: 15px; font-weight: bold;
    cursor: pointer; transition: .2s;
  }
  .login-card button:hover { background: #3a75e6; }
  .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }
  .err { color: var(--red); font-size: 13px; margin-top: 12px; height: 16px; }

  /* DASHBOARD */
  .hidden { display: none !important; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 30px; border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 20px; }
  .btn-logout {
    padding: 8px 16px; background: rgba(255,84,120,.1); color: var(--red);
    border: 1px solid rgba(255,84,120,.3); border-radius: 8px; cursor: pointer;
    font-weight: bold;
  }
  
  .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
  
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border);
  }
  .stat-title { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: bold; }
  .stat-value { font-size: 28px; font-weight: bold; margin-top: 8px; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 768px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .grid { grid-template-columns: 1fr; }
    .header { padding: 15px 20px; }
  }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; height: 500px; display: flex; flex-direction: column;
  }
  .panel-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    font-weight: bold; display: flex; justify-content: space-between; align-items: center;
  }
  .panel-title { font-size: 14px; }
  .panel-meta { font-size: 12px; color: var(--blue); }
  
  .terminal {
    flex: 1; overflow-y: auto; padding: 16px;
    background: #050914; font-family: monospace; font-size: 12px; line-height: 1.6;
  }
  .log-line { margin-bottom: 4px; word-break: break-all; }
  .log-line.error { color: var(--red); }
  .log-line.ok { color: var(--green); }
  .log-line.info { color: var(--blue); }
  .log-line.normal { color: #c9d6ec; }

  .bot-list {
    flex: 1; overflow-y: auto; list-style: none;
  }
  .bot-item {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .bot-item:last-child { border-bottom: none; }
  .bot-name { font-weight: bold; font-size: 13px; }
  .bot-uid { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .bot-status {
    font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 6px;
    background: rgba(32,227,162,.1); color: var(--green);
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <h1>ZansPM Admin</h1>
    <p>Vui lòng đăng nhập để tiếp tục</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
      <button type="submit" id="login-btn">Đăng nhập</button>
    </form>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen" class="hidden">
  <div class="header">
    <h1>ZansPM Dashboard</h1>
    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-title">Bot Đang Chạy</div>
        <div class="stat-value green" id="stat-running">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Tổng Bot</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Đã Tham Gia</div>
        <div class="stat-value blue" id="stat-joined">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Lỗi</div>
        <div class="stat-value red" id="stat-failed">0</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">System Terminal</span>
          <span class="panel-meta" id="log-count">0 dòng</span>
        </div>
        <div class="terminal" id="terminal"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Bot Control</span>
          <span class="panel-meta" id="bot-count">0 bots</span>
        </div>
        <ul class="bot-list" id="bot-list"></ul>
      </div>
    </div>
  </div>
</div>

<script>
  let lastLogId = 0;
  let isLoggedIn = false;
  let intervals = [];

  // Xử lý đăng nhập
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-err');
    const pwd = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerText = "Đang kiểm tra...";
    err.innerText = "";

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'password=' + encodeURIComponent(pwd)
      });
      const data = await res.json();

      if (data.success) {
        isLoggedIn = true;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        startDashboard();
      } else {
        err.innerText = data.error || "Mật khẩu không chính xác!";
        btn.disabled = false;
        btn.innerText = "Đăng nhập";
      }
    } catch (error) {
      err.innerText = "Lỗi kết nối đến máy chủ!";
      btn.disabled = false;
      btn.innerText = "Đăng nhập";
    }
  });

  // Khởi động Dashboard
  function startDashboard() {
    fetchStats();
    fetchLogs();
    fetchBots();

    intervals.push(setInterval(fetchStats, 3000));
    intervals.push(setInterval(fetchLogs, 1500));
    intervals.push(setInterval(fetchBots, 5000));
  }

  // Lấy thông số
  async function fetchStats() {
    try {
      const res = await fetch('/api/stats');
      if (res.status === 401) return logout();
      const data = await res.json();
      
      document.getElementById('stat-running').innerText = data.running || 0;
      document.getElementById('stat-total').innerText = data.total_bots || 0;
      document.getElementById('stat-joined').innerText = data.joined || 0;
      document.getElementById('stat-failed').innerText = data.failed || 0;
    } catch (e) {
      console.error("Stats error", e);
    }
  }

  // Lấy Log
  async function fetchLogs() {
    try {
      const res = await fetch('/api/logs?after=' + lastLogId);
      if (res.status === 401) return logout();
      const data = await res.json();
      
      if (data.lines && data.lines.length > 0) {
        const term = document.getElementById('terminal');
        
        data.lines.forEach(line => {
          // Xóa mã màu ANSI
          const cleanLine = line.replace(/\x1b\[[0-9;]*m/g, '');
          const div = document.createElement('div');
          div.className = 'log-line';
          
          if (cleanLine.includes('[ERROR]') || cleanLine.includes('✗')) {
            div.classList.add('error');
          } else if (cleanLine.includes('[OK]') || cleanLine.includes('[LOGIN]') || cleanLine.includes('✓')) {
            div.classList.add('ok');
          } else if (cleanLine.includes('[API]') || cleanLine.includes('[SYS]') || cleanLine.includes('[HTTP]')) {
            div.classList.add('info');
          } else {
            div.classList.add('normal');
          }
          
          div.innerText = cleanLine;
          term.appendChild(div);
        });
        
        lastLogId = data.total;
        
        // Giới hạn 1000 dòng để không lag
        while (term.children.length > 1000) {
          term.removeChild(term.firstChild);
        }
        
        // Tự động cuộn xuống dưới
        term.scrollTop = term.scrollHeight;
        
        document.getElementById('log-count').innerText = data.total + " dòng";
      }
    } catch (e) {
      console.error("Logs error", e);
    }
  }

  // Lấy danh sách Bot
  async function fetchBots() {
    try {
      const res = await fetch('/api/bots');
      if (res.status === 401) return logout();
      const data = await res.json();
      
      const bots = Array.isArray(data) ? data : (data.bots || []);
      const list = document.getElementById('bot-list');
      list.innerHTML = ''; 
      
      document.getElementById('bot-count').innerText = bots.length + " bots";

      if (bots.length === 0) {
        list.innerHTML = '<li style="padding:16px;color:#8fa3c0;text-align:center">Chưa có bot nào</li>';
        return;
      }

      // Giới hạn hiển thị 100 bot để không lag trình duyệt
      const displayBots = bots.slice(0, 100);

      displayBots.forEach(bot => {
        const li = document.createElement('li');
        li.className = 'bot-item';
        li.innerHTML = `
          <div>
            <div class="bot-name">${bot.nickname || 'Unknown'}</div>
            <div class="bot-uid">${bot.uid}</div>
          </div>
          <div class="bot-status">${bot.status || 'RUNNING'}</div>
        `;
        list.appendChild(li);
      });
    } catch (e) {
      console.error("Bots error", e);
    }
  }

  // Đăng xuất
  function logout() {
    isLoggedIn = false;
    intervals.forEach(clearInterval);
    intervals = [];
    document.getElementById('dashboard-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').innerText = "Đăng nhập";
    document.getElementById('password').value = "";
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050711">
<title>ZansPM Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #050711; --panel: #0c1426; --border: rgba(0,245,255,.2);
    --text: #eafaff; --muted: #8294b5; --cyan: #00f5ff; --green: #00ffad; --red: #ff386c;
    --font: "Inter", sans-serif; --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    min-height: 100vh; color: var(--text); font-family: var(--font);
    background: radial-gradient(circle at 10% 0%, rgba(0,245,255,.15), transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(168,85,255,.15), transparent 40%), var(--bg);
}
button { cursor: pointer; font-family: inherit; }
.hidden { display: none !important; }

/* LOGIN SCREEN */
.login-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
.login-card {
    width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 20px;
    background: rgba(12,20,38,.9); border: 1px solid var(--border);
    box-shadow: 0 0 30px rgba(0,245,255,.1); text-align: center;
}
.login-logo {
    width: 60px; height: 60px; margin: 0 auto 20px; border-radius: 15px;
    background: linear-gradient(135deg, var(--cyan), #a855ff);
    display: flex; justify-content: center; align-items: center;
    font-size: 28px; font-weight: 900; color: #fff;
}
.login-card h1 { font-size: 24px; margin-bottom: 10px; }
.login-card p { color: var(--muted); font-size: 13px; margin-bottom: 25px; }
.login-card input {
    width: 100%; height: 50px; padding: 0 15px; margin-bottom: 15px;
    border-radius: 10px; border: 1px solid var(--border); background: #050b19; color: #fff; outline: none;
}
.login-card input:focus { border-color: var(--cyan); }
.login-card button {
    width: 100%; height: 50px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #087dff, var(--cyan)); color: #fff; font-weight: 800; font-size: 15px;
}
.login-card button:disabled { opacity: 0.6; }
.login-err { color: var(--red); font-size: 13px; margin-top: 15px; height: 16px; }

/* DASHBOARD */
.app { max-width: 1400px; margin: 0 auto; padding: 20px; }
.header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; border: 1px solid var(--border); border-radius: 15px;
    background: rgba(12,20,38,.8); margin-bottom: 25px;
}
.header h1 { font-size: 20px; color: var(--cyan); }
.btn-logout { background: rgba(255,56,108,.1); color: var(--red); border: 1px solid rgba(255,56,108,.3); padding: 8px 15px; border-radius: 8px; font-weight: bold; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
@media(max-width: 768px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat-card { background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
.stat-title { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
.stat-value { font-size: 32px; font-weight: 900; margin-top: 10px; }
.stat-value.green { color: var(--green); text-shadow: 0 0 10px rgba(0,255,173,.3); }
.stat-value.red { color: var(--red); text-shadow: 0 0 10px rgba(255,56,108,.3); }
.stat-value.cyan { color: var(--cyan); text-shadow: 0 0 10px rgba(0,245,255,.3); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media(max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 15px; height: 500px; display: flex; flex-direction: column; }
.panel-head { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; }
.terminal { flex: 1; overflow-y: auto; padding: 15px; background: #030711; font-family: var(--mono); font-size: 12px; line-height: 1.7; }
.log-line { margin-bottom: 5px; word-break: break-all; }
.log-line.error { color: var(--red); }
.log-line.ok { color: var(--green); }
.log-line.info { color: var(--cyan); }
.bot-list { flex: 1; overflow-y: auto; list-style: none; }
.bot-item { padding: 12px 20px; border-bottom: 1px solid rgba(0,245,255,.1); display: flex; justify-content: space-between; }
.bot-name { font-weight: 800; }
.bot-uid { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.bot-status { font-size: 10px; font-weight: 800; color: var(--green); background: rgba(0,255,173,.1); padding: 4px 8px; border-radius: 5px; height: fit-content; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-screen">
    <div class="login-card">
        <div class="login-logo">Z</div>
        <h1>ZansPM Admin</h1>
        <p>Nhập mật khẩu để tiếp tục</p>
        <form id="login-form">
            <input type="password" id="password" placeholder="Mật khẩu..." required>
            <button type="submit" id="login-btn">Đăng nhập</button>
        </form>
        <div class="login-err" id="login-err"></div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen" class="app hidden">
    <div class="header">
        <h1>ZansPM Control</h1>
        <button class="btn-logout" onclick="location.reload()">Làm mới</button>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="stat-title">Bot Đang Chạy</div><div class="stat-value green" id="stat-running">0</div></div>
        <div class="stat-card"><div class="stat-title">Tổng Bot</div><div class="stat-value cyan" id="stat-total">0</div></div>
        <div class="stat-card"><div class="stat-title">Đã Tham Gia</div><div class="stat-value cyan" id="stat-joined">0</div></div>
        <div class="stat-card"><div class="stat-title">Lỗi</div><div class="stat-value red" id="stat-failed">0</div></div>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="panel-head"><span>System Terminal</span><span id="log-count">0 dòng</span></div>
            <div class="terminal" id="terminal"></div>
        </div>
        <div class="panel">
            <div class="panel-head"><span>Bot List</span><span id="bot-count">0 bots</span></div>
            <ul class="bot-list" id="bot-list"></ul>
        </div>
    </div>
</div>

<script>
    let lastLogId = 0;
    let intervals = [];

    // Xử lý đăng nhập
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const err = document.getElementById('login-err');
        const pwd = document.getElementById('password').value;

        btn.disabled = true;
        btn.innerText = "Đang kiểm tra...";
        err.innerText = "";

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'password=' + encodeURIComponent(pwd)
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                startDashboard();
            } else {
                err.innerText = data.error || "Sai mật khẩu!";
                btn.disabled = false;
                btn.innerText = "Đăng nhập";
            }
        } catch (error) {
            err.innerText = "Lỗi kết nối Server!";
            btn.disabled = false;
            btn.innerText = "Đăng nhập";
        }
    });

    // Khởi động
    function startDashboard() {
        fetchStats(); fetchLogs(); fetchBots();
        intervals.push(setInterval(fetchStats, 3000));
        intervals.push(setInterval(fetchLogs, 1500));
        intervals.push(setInterval(fetchBots, 5000));
    }

    // Lấy thông số
    async function fetchStats() {
        try {
            const res = await fetch('/api/stats');
            if (res.status === 401) return location.reload();
            const data = await res.json();
            document.getElementById('stat-running').innerText = data.running || 0;
            document.getElementById('stat-total').innerText = data.total_bots || 0;
            document.getElementById('stat-joined').innerText = data.joined || 0;
            document.getElementById('stat-failed').innerText = data.failed || 0;
        } catch (e) { console.log(e); }
    }

    // Lấy Log
    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs?after=' + lastLogId);
            if (res.status === 401) return location.reload();
            const data = await res.json();
            
            if (data.lines && data.lines.length > 0) {
                const term = document.getElementById('terminal');
                data.lines.forEach(line => {
                    const cleanLine = line.replace(/\x1b\[[0-9;]*m/g, '');
                    const div = document.createElement('div');
                    div.className = 'log-line';
                    if (cleanLine.includes('[ERROR]') || cleanLine.includes('✗')) div.classList.add('error');
                    else if (cleanLine.includes('[OK]') || cleanLine.includes('[LOGIN]') || cleanLine.includes('✓')) div.classList.add('ok');
                    else if (cleanLine.includes('[API]') || cleanLine.includes('[SYS]') || cleanLine.includes('[HTTP]')) div.classList.add('info');
                    div.innerText = cleanLine;
                    term.appendChild(div);
                });
                lastLogId = data.total;
                while (term.children.length > 1000) term.removeChild(term.firstChild);
                term.scrollTop = term.scrollHeight;
                document.getElementById('log-count').innerText = data.total + " dòng";
            }
        } catch (e) { console.log(e); }
    }

    // Lấy Danh sách Bot
    async function fetchBots() {
        try {
            const res = await fetch('/api/bots');
            if (res.status === 401) return location.reload();
            const data = await res.json();
            const bots = Array.isArray(data) ? data : (data.bots || []);
            const list = document.getElementById('bot-list');
            list.innerHTML = ''; 
            document.getElementById('bot-count').innerText = bots.length + " bots";

            if (bots.length === 0) {
                list.innerHTML = '<li style="padding:20px;color:#8294b5;text-align:center">Chưa có bot nào</li>';
                return;
            }

            // Chỉ hiển thị 100 bot đầu để không lag
            const displayBots = bots.slice(0, 100);
            displayBots.forEach(bot => {
                const li = document.createElement('li');
                li.className = 'bot-item';
                li.innerHTML = `
                    <div>
                        <div class="bot-name">${bot.nickname || 'Unknown'}</div>
                        <div class="bot-uid">${bot.uid}</div>
                    </div>
                    <div class="bot-status">${bot.status || 'RUNNING'}</div>
                `;
                list.appendChild(li);
            });
        } catch (e) { console.log(e); }
    }
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Đăng nhập · Zan Hosting</title>
<style>
:root{color-scheme:dark;--line:#2c3550;--muted:#98a5bf;--purple:#a99aff;--cyan:#68e1df}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow-x:hidden;
  background:radial-gradient(ellipse at 15% 0%,#282052,transparent 42%),radial-gradient(ellipse at 100% 90%,#12343b,transparent 38%),#090d18;
  color:#f4f6ff;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:38px 38px}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;animation:float 14s ease-in-out infinite}
.blob.b1{width:320px;height:320px;background:#6d5cff;top:-90px;left:-90px}
.blob.b2{width:300px;height:300px;background:#1fbfb8;bottom:-100px;right:-80px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,24px)}}
.box{position:relative;width:min(440px,100%);padding:34px 30px 28px;border:1px solid var(--line);border-radius:26px;
  background:linear-gradient(160deg,#141b2eef,#0d1424ef);box-shadow:0 30px 90px #0007,0 0 0 1px #ffffff08 inset;
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.logo{width:56px;height:56px;display:grid;place-items:center;border-radius:18px;
  background:linear-gradient(135deg,#ad9cff,#63e4df);color:#080d18;font-size:27px;font-weight:950;box-shadow:0 10px 34px #7f71ff45}
.eyebrow{margin:20px 0 6px;color:#a99dff;font-size:11px;letter-spacing:1.8px;font-weight:800}
.box h1{margin:0;font-size:30px;line-height:1.2;letter-spacing:-.9px}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.grad{background:linear-gradient(100deg,#b7aaff,#69e6df);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted);font-size:14px;margin:8px 0 0}
label{display:block;margin:26px 0 8px;font-size:12px;font-weight:750;letter-spacing:.4px}
.field{position:relative}
.field .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7;pointer-events:none}
input{width:100%;padding:14px 46px 14px 42px;border-radius:13px;border:1px solid #303b55;background:#080d17;color:#fff;outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#9b8cff;box-shadow:0 0 0 4px #9b8cff22}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;margin:0;padding:0;border:0;border-radius:9px;
  background:transparent;color:#aab6d0;font-size:16px;cursor:pointer;display:grid;place-items:center}
.eye:hover{background:#1a2335}
.submit{width:100%;margin-top:16px;padding:14px;border:0;border-radius:13px;background:linear-gradient(100deg,#a99aff,#68e1df);
  font-weight:850;font-size:15px;color:#080d18;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 10px 30px #7f71ff30}
.submit:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 14px 36px #7f71ff45}
.submit:active{transform:translateY(0)}
.error{margin-top:14px;padding:10px 12px;border-radius:11px;color:#ffb3c0;background:#2d1822;border:1px solid #5b3043;font-size:13px;animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hint{margin-top:22px;padding:12px 14px;border-radius:12px;background:#241e15;border:1px solid #685532;color:#e9d5a3;font-size:12px}
.foot{margin-top:18px;text-align:center;color:#6f7e9b;font-size:11px}
@media(max-width:420px){.box{padding:28px 20px 22px;border-radius:22px}.box h1{font-size:26px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main class="box">
  <div class="logo">Z</div>
  <div class="eyebrow">ZAN HOSTING · PRIVATE PANEL</div>
  <h1>Chào <span class="grad">admin</span> <span class="wave">👋</span></h1>
  <p class="muted">Vui lòng nhập mật khẩu để tiếp tục.</p>
  <form method="post" autocomplete="on">
    <label for="password">MẬT KHẨU</label>
    <div class="field">
      <span class="ico">🔒</span>
      <input id="password" name="password" type="password" placeholder="Nhập mật khẩu admin" autocomplete="current-password" required autofocus>
      <button class="eye" type="button" id="eye" aria-label="Hiện hoặc ẩn mật khẩu">👁</button>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button class="submit" type="submit">Vào bảng điều khiển →</button>
  </form>
  <div class="hint">Chỉ dùng cho bot và mã nguồn bạn tin tưởng. Không chia sẻ mật khẩu bảng điều khiển.</div>
  <div class="foot">ZAN HOSTING · Python chạy phía máy chủ</div>
</main>
<script>
(function(){
  var pw=document.getElementById('password'),eye=document.getElementById('eye');
  eye.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    eye.textContent=show?'🙈':'👁';
    pw.focus();
  });
})();
</script>
</body>
</html>

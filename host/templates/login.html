<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Đăng nhập · Zan Hosting</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 0%,#282052,transparent 40%),radial-gradient(ellipse at 100% 90%,#12343b,transparent 35%),#090d18;color:#f4f6ff;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(430px,100%);padding:30px;border:1px solid #2c3550;border-radius:24px;background:#101625eF;box-shadow:0 30px 90px #0005}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#ad9cff,#63e4df);color:#080d18;font-size:25px;font-weight:950}.eyebrow{margin:20px 0 5px;color:#a99dff;font-size:11px;letter-spacing:1.7px;font-weight:800}.box h1{margin:0;font-size:28px;letter-spacing:-.8px}.muted{color:#98a5bf;font-size:13px}label{display:block;margin:22px 0 7px;font-size:12px;font-weight:750}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #303b55;background:#080d17;color:#fff;outline:none}input:focus{border-color:#9b8cff}button{width:100%;margin-top:13px;padding:13px;border:0;border-radius:12px;background:linear-gradient(100deg,#a99aff,#68e1df);font-weight:850;color:#080d18;cursor:pointer}.error{margin-top:14px;color:#ff9dad;font-size:13px}.hint{margin-top:20px;padding:12px;border-radius:12px;background:#241e15;border:1px solid #685532;color:#e9d5a3;font-size:12px}
</style></head><body><main class="box"><div class="logo">Z</div><div class="eyebrow">ZAN HOSTING · PRIVATE PANEL</div><h1>Đăng nhập</h1><p class="muted">Đăng nhập bằng mật khẩu quản trị đã cấu hình trên Render.</p><form method="post"><label for="password">MẬT KHẨU QUẢN TRỊ</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">Vào bảng điều khiển →</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="hint">Chỉ dùng cho bot và mã nguồn bạn tin tưởng. Không chia sẻ mật khẩu bảng điều khiển.</div></main></body></html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Token Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0a0e1a;
            position: relative;
        }

        .bg-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .bg-wrap .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .bg-wrap .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #00b4ff, #0044cc);
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }
        .bg-wrap .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #7c3aed, #4f46e5);
            bottom: -15%;
            right: -10%;
            animation-delay: -5s;
        }
        .bg-wrap .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00c853, #00b4ff);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-40px, 50px) scale(0.9);
            }
            100% {
                transform: translate(30px, -60px) scale(1.05);
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% {
                opacity: 0.15;
                transform: scale(0.7);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(12, 18, 38, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 40px 34px;
            max-width: 520px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.6);
            animation: cardFloat 8s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-6px);
            }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .badge {
            background: linear-gradient(135deg, #00b4ff, #0066ff);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            animation: badgeGlow 3s ease-in-out infinite;
        }

        @keyframes badgeGlow {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(0, 180, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 25px 5px rgba(0, 180, 255, 0.08);
            }
        }

        .badge i {
            margin-right: 6px;
        }

        .version {
            color: #4a5a7a;
            font-size: 11px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 14px;
            border-radius: 40px;
            opacity: 0.7;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            margin: 10px 0 2px 0;
        }

        h1 span {
            background: linear-gradient(135deg, #00b4ff, #7c3aed, #00c853);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 5s ease-in-out infinite;
        }

        @keyframes gradShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .sub {
            color: #6a7a9a;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sub i {
            color: #00b4ff;
        }
        .sub .status {
            margin-left: auto;
            color: #00c853;
            font-size: 11px;
            font-weight: 500;
        }
        .sub .status i {
            color: #00c853;
            font-size: 8px;
            margin-right: 4px;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        .credit {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .credit .social {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .credit .social a {
            color: #5a6a8a;
            font-size: 20px;
            transition: 0.3s;
            text-decoration: none;
        }

        .credit .social a:hover {
            color: #00b4ff;
            transform: translateY(-3px) scale(1.1);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            color: #7a8aaa;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .input-group label i {
            color: #00b4ff;
            margin-right: 6px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            background: #0a0e1a;
            border-radius: 60px;
            padding: 4px 4px 4px 18px;
            border: 1px solid #1a2a4a;
            transition: 0.3s;
            gap: 4px;
        }

        .input-wrap:focus-within {
            border-color: #00b4ff;
            box-shadow: 0 0 0 4px rgba(0, 180, 255, 0.08);
        }

        .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 0;
            color: #fff;
            font-size: 13px;
            outline: none;
            min-width: 0;
        }

        .input-wrap input::placeholder {
            color: #3a4a6a;
        }

        .input-wrap .paste-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #8ab4f8;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-wrap .paste-btn:hover {
            background: rgba(0, 180, 255, 0.15);
            color: #00b4ff;
        }

        .input-wrap .eye-btn {
            background: transparent;
            border: none;
            color: #4a5a7a;
            padding: 10px 14px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            flex-shrink: 0;
        }

        .input-wrap .eye-btn:hover {
            color: #00b4ff;
        }

        .input-wrap .icon {
            color: #3a4a6a;
            font-size: 14px;
            padding-right: 4px;
            flex-shrink: 0;
        }

        .btn-generate {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00b4ff, #7c3aed);
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-generate::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            animation: btnShine 5s ease-in-out infinite;
        }

        @keyframes btnShine {
            0% {
                transform: translateX(-100%) rotate(25deg);
            }
            100% {
                transform: translateX(100%) rotate(25deg);
            }
        }

        .btn-generate:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 40px rgba(0, 180, 255, 0.3);
        }

        .btn-generate:active {
            transform: scale(0.97);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result-box {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
            animation: resultPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes resultPop {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .result-box.show {
            display: block;
        }

        .result-box .info-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 8px;
        }

        .result-box .info-item:last-child {
            margin-bottom: 0;
        }

        .result-box .info-item .label {
            color: #4a5a7a;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .result-box .info-item .label i {
            color: #00b4ff;
            margin-right: 4px;
        }

        .result-box .info-item .value {
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            margin-top: 3px;
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .result-box .info-item .value.loading {
            color: #00b4ff;
        }

        .result-box .copy-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #8ab4f8;
            padding: 2px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            transition: 0.2s;
        }

        .result-box .copy-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .err-msg {
            background: rgba(255, 50, 50, 0.06);
            border-left: 3px solid #ff4444;
            padding: 10px 16px;
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 13px;
            margin: 8px 0 4px 0;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        .err-msg.show {
            display: flex;
        }

        .social-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .social-footer .title {
            color: #4a5a7a;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 12px;
        }

        .social-footer .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }

        .social-footer .btn {
            padding: 10px 8px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 11px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .social-footer .btn i {
            font-size: 18px;
            transition: 0.3s;
        }
        .social-footer .btn .name {
            font-size: 9px;
            opacity: 0.6;
            font-weight: 400;
        }

        .social-footer .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .social-footer .btn.telegram {
            background: linear-gradient(135deg, #0088cc, #005f8a);
        }
        .social-footer .btn.telegram:hover {
            box-shadow: 0 8px 30px rgba(0, 136, 204, 0.3);
        }

        .social-footer .btn.tiktok {
            background: linear-gradient(135deg, #000000, #ff0050);
            position: relative;
            overflow: hidden;
        }
        .social-footer .btn.tiktok::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 229, 255, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(255, 0, 80, 0.1) 0%, transparent 60%);
            animation: tiktokSpin 4s linear infinite;
        }
        @keyframes tiktokSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .social-footer .btn.tiktok:hover {
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.3);
        }
        .social-footer .btn.tiktok i,
        .social-footer .btn.tiktok .name {
            position: relative;
            z-index: 1;
        }

        .social-footer .btn.channel {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a0e1a;
        }
        .social-footer .btn.channel:hover {
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.3);
        }

        .social-footer .btn.discord {
            background: linear-gradient(135deg, #5865F2, #4752C4);
        }
        .social-footer .btn.discord:hover {
            box-shadow: 0 8px 30px rgba(88, 101, 242, 0.3);
        }

        .footer-text {
            color: #3a4a6a;
            font-size: 11px;
            text-align: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 480px) {
            .card {
                padding: 22px 18px;
                border-radius: 24px;
            }

            h1 {
                font-size: 22px;
            }

            .social-footer .grid {
                grid-template-columns: 1fr 1fr;
            }

            .input-wrap {
                flex-wrap: nowrap;
                background: #0a0e1a;
                border: 1px solid #1a2a4a;
                border-radius: 60px;
                padding: 2px 2px 2px 14px;
            }

            .input-wrap input {
                padding: 12px 0;
                font-size: 12px;
                min-width: 40px;
            }

            .input-wrap .paste-btn {
                font-size: 10px;
                padding: 4px 10px;
            }

            .input-wrap .icon {
                display: none;
            }
            .input-wrap .eye-btn {
                padding: 8px 10px;
            }
        }

        @media (max-width: 380px) {
            .input-wrap .paste-btn span {
                display: none;
            }
            .input-wrap .paste-btn i {
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bg-wrap">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="stars" id="stars"></div>

    <div class="card">
        <div class="header">
            <span class="badge"><i class="fas fa-bolt"></i> Official Garena</span>
            <span class="version"><i class="far fa-clock"></i> v2.0</span>
        </div>

        <h1>ACCESS <span>TOKEN</span></h1>
        <div style="color: #5a6a8a; font-size: 14px; margin-top: -2px; margin-bottom: 16px;">
            <i class="fas fa-key" style="color: #00b4ff;"></i> Generator
        </div>

        <div class="sub">
            <i class="fas fa-shield-alt"></i> Secure · Official
            <span class="status"><i class="fas fa-circle"></i> Online</span>
        </div>

        <div class="credit">
            <div class="social">
                <a href="https://t.me/zanbackj" target="_blank"><i class="fab fa-telegram"></i></a>
                <a href="https://www.tiktok.com/@nqbinhan_" target="_blank"><i class="fab fa-tiktok"></i></a>
                <a href="https://t.me/zancommunity" target="_blank"><i class="fas fa-hashtag"></i></a>
                <a href="#"><i class="fab fa-discord"></i></a>
            </div>
        </div>

        <div class="input-group">
            <label><i class="fas fa-id-card"></i> Guest UID</label>
            <div class="input-wrap">
                <span class="icon"><i class="fas fa-user"></i></span>
                <input type="text" id="uidInput" placeholder="Nhập UID khách..." />
                <button class="paste-btn" id="pasteUidBtn"><i class="fas fa-paste"></i> <span>Dán</span></button>
            </div>
        </div>

        <div class="input-group">
            <label><i class="fas fa-lock"></i> Guest Password</label>
            <div class="input-wrap">
                <span class="icon"><i class="fas fa-key"></i></span>
                <input type="password" id="passInput" placeholder="Nhập mật khẩu..." />
                <button class="paste-btn" id="pastePassBtn"><i class="fas fa-paste"></i> <span>Dán</span></button>
                <button class="eye-btn" id="togglePass"><i class="fas fa-eye"></i></button>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn">
            <i class="fas fa-rocket"></i> GENERATE ACCESS TOKEN
        </button>

        <div class="err-msg" id="errorMsg">
            <i class="fas fa-triangle-exclamation"></i>
            <span>Lỗi! Kiểm tra lại UID và mật khẩu.</span>
        </div>

        <div class="result-box" id="resultBox">
            <div class="info-item">
                <div class="label"><i class="fas fa-key"></i> Access Token</div>
                <div class="value" id="tokenDisplay">—</div>
            </div>
            <div class="info-item">
                <div class="label"><i class="fas fa-user"></i> Open ID</div>
                <div class="value" id="openIdDisplay">—</div>
            </div>
        </div>

        <div class="social-footer">
            <div class="title"><i class="fas fa-share-alt"></i> Kết nối</div>
            <div class="grid">
                <a href="https://t.me/zanbackj" target="_blank" class="btn telegram">
                    <i class="fab fa-telegram-plane"></i>
                    <span class="name">Telegram</span>
                </a>
                <a href="https://www.tiktok.com/@nqbinhan_" target="_blank" class="btn tiktok">
                    <i class="fab fa-tiktok"></i>
                    <span class="name">TikTok</span>
                </a>
                <a href="https://t.me/zancommunity" target="_blank" class="btn channel">
                    <i class="fas fa-hashtag"></i>
                    <span class="name">Channel</span>
                </a>
                <a href="#" target="_blank" class="btn discord">
                    <i class="fab fa-discord"></i>
                    <span class="name">Discord</span>
                </a>
            </div>
        </div>

        <div class="footer-text">
            <i class="fas fa-shield-halved" style="color:#00b4ff; opacity:0.3;"></i>
            Secure · 2026
        </div>
    </div>

    <script>
        (function() {
            // ===== STARS =====
            const stars = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 4 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                stars.appendChild(star);
            }

            // ===== DOM =====
            const uidInput = document.getElementById('uidInput');
            const passInput = document.getElementById('passInput');
            const generateBtn = document.getElementById('generateBtn');
            const tokenDisplay = document.getElementById('tokenDisplay');
            const openIdDisplay = document.getElementById('openIdDisplay');
            const errorMsg = document.getElementById('errorMsg');
            const resultBox = document.getElementById('resultBox');
            const togglePass = document.getElementById('togglePass');
            const pasteUidBtn = document.getElementById('pasteUidBtn');
            const pastePassBtn = document.getElementById('pastePassBtn');

            // ===== PASTE BUTTONS =====
            pasteUidBtn.addEventListener('click', async function() {
                try {
                    const text = await navigator.clipboard.readText();
                    uidInput.value = text;
                } catch (_) {
                    alert('Không thể đọc clipboard! Vui lòng paste thủ công (Ctrl+V)');
                }
            });

            pastePassBtn.addEventListener('click', async function() {
                try {
                    const text = await navigator.clipboard.readText();
                    passInput.value = text;
                } catch (_) {
                    alert('Không thể đọc clipboard! Vui lòng paste thủ công (Ctrl+V)');
                }
            });

            // ===== Toggle Password =====
            togglePass.addEventListener('click', function() {
                const type = passInput.type === 'password' ? 'text' : 'password';
                passInput.type = type;
                this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });

            // ===== Functions =====
            function showError(msg) {
                errorMsg.querySelector('span').textContent = msg;
                errorMsg.className = 'err-msg show';
            }

            function hideError() {
                errorMsg.className = 'err-msg';
            }

            function setLoading() {
                tokenDisplay.textContent = '⏳ Đang lấy...';
                tokenDisplay.className = 'value loading';
                openIdDisplay.textContent = '⏳';
                resultBox.className = 'result-box show';
            }

            function setResult(data) {
                tokenDisplay.textContent = data.access_token || '—';
                tokenDisplay.className = 'value';
                openIdDisplay.textContent = data.open_id || '—';
                resultBox.className = 'result-box show';
            }

            // ===== LẤY TOKEN BẰNG 2 CÁCH =====
            async function generateToken() {
                const uid = uidInput.value.trim();
                const password = passInput.value.trim();

                if (!uid || !password) {
                    showError('⚠️ Vui lòng nhập đầy đủ UID và mật khẩu!');
                    return;
                }
                if (!uid.match(/^\d+$/)) {
                    showError('⚠️ UID phải là số!');
                    return;
                }

                hideError();
                setLoading();
                generateBtn.disabled = true;
                generateBtn.innerHTML = '<span class="spinner"></span> Đang tạo...';

                // ===== CÁCH 1: GỌI API =====
                try {
                    const apiUrl = 'https://zaninfo.onrender.com/gettoken?uid=' + encodeURIComponent(uid) + '&pass=' +
                        encodeURIComponent(password);

                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 10000);

                    const resp = await fetch(apiUrl, {
                        signal: controller.signal,
                        headers: { 'Accept': 'application/json' }
                    });

                    clearTimeout(timeout);

                    if (resp.ok) {
                        const data = await resp.json();
                        if (data.success && data.access_token) {
                            setResult({
                                access_token: data.access_token,
                                open_id: data.open_id || '—'
                            });
                            generateBtn.disabled = false;
                            generateBtn.innerHTML = '<i class="fas fa-rocket"></i> GENERATE ACCESS TOKEN';
                            return;
                        }
                    }
                } catch (e) {
                    console.log('API Error, trying direct method...', e);
                }

                // ===== CÁCH 2: GỌI TRỰC TIẾP GARENA (như code Telegram) =====
                try {
                    const url = 'https://100067.connect.garena.com/oauth/guest/token/grant';
                    const headers = {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'User-Agent': 'Dalvik/2.1.0 (Linux; U; Android 7.1.2)',
                        'Accept-Encoding': 'gzip, deflate, br',
                        'Connection': 'close'
                    };
                    const body = new URLSearchParams({
                        uid: uid,
                        password: password,
                        response_type: 'token',
                        client_type: '2',
                        client_secret: '2ee44819e9b4598845141067b281621874d0d5d7af9d8f7e00c1e54715b7d1e3',
                        client_id: '100067'
                    });

                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 15000);

                    const resp = await fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: body,
                        signal: controller.signal
                    });

                    clearTimeout(timeout);

                    if (!resp.ok) {
                        throw new Error('HTTP ' + resp.status);
                    }

                    const data = await resp.json();

                    if (data.access_token) {
                        setResult({
                            access_token: data.access_token,
                            open_id: data.open_id || '—'
                        });
                    } else {
                        showError('❌ Sai UID hoặc mật khẩu!');
                        resultBox.className = 'result-box';
                    }

                } catch (err) {
                    if (err.name === 'AbortError') {
                        showError('⏳ Quá thời gian chờ! Vui lòng thử lại.');
                    } else {
                        showError('❌ ' + err.message);
                    }
                    resultBox.className = 'result-box';
                }

                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-rocket"></i> GENERATE ACCESS TOKEN';
            }

            // ===== Events =====
            generateBtn.addEventListener('click', generateToken);
            uidInput.addEventListener('keydown', e => { if (e.key === 'Enter') passInput.focus(); });
            passInput.addEventListener('keydown', e => { if (e.key === 'Enter') generateBtn.click(); });

            // ===== Copy Token =====
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.textContent = '📋 Copy';
            copyBtn.onclick = function() {
                const text = tokenDisplay.textContent;
                if (text && text !== '—' && !text.includes('⏳') && !text.includes('❌')) {
                    navigator.clipboard.writeText(text).then(() => alert('✅ Đã copy Access Token!'))
                        .catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            document.body.removeChild(ta);
                            alert('✅ Đã copy Access Token!');
                        });
                }
            };
            tokenDisplay.parentNode.appendChild(copyBtn);

            console.log('✅ Access Token Generator ready! (Dual mode)');
        })();
    </script>

</body>
